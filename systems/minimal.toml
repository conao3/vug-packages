name = "minimal"
kernel = "linux"
init = "{pkg:bash}/bin/bash /etc/vug-init"
sh = "{pkg:bash}/bin/bash"
packages = [
  "bash",
  "coreutils",
  "findutils",
  "grep",
  "procps",
  "sed",
  "util-linux",
]

[[file]]
path = "/etc/vug-init"
mode = "755"
content = """
#!/bin/bash
export PATH=/bin
mount -t sysfs sys /sys
echo "vug system: $(cat /etc/hostname)"
bash --version | head -n 1
ls --version | head -n 1
mount --version
uname -srm
echo "processes: $(ps -e | wc -l)"
echo VUG-SYSTEM-OK
exec bash
"""

[[file]]
path = "/etc/hostname"
content = "vug-minimal\n"

[[group]]
name = "root"
gid = 0

[[user]]
name = "root"
uid = 0
group = "root"
home = "/root"
shell = "/bin/bash"
