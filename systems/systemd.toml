name = "systemd"
kernel = "linux"
init = "{pkg:systemd}/lib/systemd/systemd"
sh = "{pkg:bash}/bin/bash"
packages = [
  "bash",
  "coreutils",
  "findutils",
  "grep",
  "procps",
  "sed",
  "shadow",
  "vug",
]

[service.dhcpcd]

[service.serial-autologin]
user = "conao"

[service.sudo]
wheel = "NOPASSWD: ALL"

[service.systemd]

[[file]]
path = "/etc/os-release"
content = """
NAME="vug"
ID=vug
PRETTY_NAME="vug minimal"
"""

[[file]]
path = "/etc/hostname"
kind = "seed"
content = "vug-minimal\n"

[[file]]
path = "/etc/login.defs"
content = """
ENCRYPT_METHOD SHA512
ENV_PATH PATH=/run/wrappers/bin:/bin
ENV_SUPATH PATH=/run/wrappers/bin:/bin
"""

[[file]]
path = "/etc/profile"
content = """
echo VUG-LOGIN-OK "$(id -un)" "$(tty)"
sudo true && echo VUG-SUDO-OK "$(sudo id -u)"
"""

[[group]]
name = "root"
gid = 0

[[group]]
name = "conao"
gid = 1000

[[user]]
name = "root"
uid = 0
group = "root"
home = "/root"
shell = "/bin/bash"

[[user]]
name = "conao"
uid = 1000
group = "conao"
groups = ["wheel"]
home = "/home/conao"
shell = "/bin/bash"
password = ""
