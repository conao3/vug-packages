name: Publish binary cache
on:
  workflow_dispatch:
    inputs:
      base:
        description: Last commit whose packages are published; the run builds the packages that differ between it and the master head
        required: true
      rebuild:
        description: Space-separated unchanged packages to build from source as well
        default: ''
      replace-archives:
        description: Space-separated store IDs whose published archives are overwritten
        default: ''
      no-prune:
        description: Keep objects outside the two retained checkouts
        type: boolean
        default: false
      dry-run:
        description: Print the plan without writing
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-binary-cache
  cancel-in-progress: false
env:
  VUG_BINARY_CACHE_URL: https://pub-da78c0bd9fc84d998fefca158806f160.r2.dev
  VUG_CACHE_PUBLIC_KEY: ${{ vars.VUG_CACHE_PUBLIC_KEY }}
jobs:
  plan:
    runs-on: ubuntu-26.04
    environment: dev
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      changed: ${{ steps.plan.outputs.changed }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check publisher configuration
        env:
          HAS_SIGNING_KEY: ${{ secrets.VUG_CACHE_SIGNING_KEY != '' }}
          HAS_ENDPOINT: ${{ secrets.VUG_CACHE_S3_ENDPOINT != '' }}
          HAS_ACCESS_KEY: ${{ secrets.VUG_CACHE_S3_ACCESS_KEY_ID != '' }}
          HAS_SECRET_KEY: ${{ secrets.VUG_CACHE_S3_SECRET_ACCESS_KEY != '' }}
        run: |
          if [[ "$HAS_SIGNING_KEY" != true || "$HAS_ENDPOINT" != true ||
                "$HAS_ACCESS_KEY" != true || "$HAS_SECRET_KEY" != true ||
                -z "$VUG_CACHE_PUBLIC_KEY" ]]; then
            echo "Configure the VUG_CACHE_* secrets of the dev environment and the VUG_CACHE_PUBLIC_KEY variable" >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check that master contains the commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/package-builds.py cache-current
      - name: Select changed packages and shards
        id: plan
        env:
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ github.sha }}
          REBUILD_PACKAGES: ${{ inputs.rebuild }}
        run: python3 .github/scripts/package-builds.py cache-plan

  build:
    name: Build (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check out candidate records
        env:
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/package-builds.py checkout
      - uses: cachix/install-nix-action@v32.0.0
      - name: Set up vug
        env:
          GH_TOKEN: ${{ github.token }}
          VUG_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p "$RUNNER_TEMP/vug/bin"
          gh release download "$VUG_TAG" --repo conao3/rust-vug \
            --pattern "vug-${VUG_TAG#v}-x86_64-linux-musl.tar.gz" --output - |
            tar -xz -C "$RUNNER_TEMP/vug/bin" vug vug-bwrap
          [[ "$("$RUNNER_TEMP/vug/bin/vug" --version)" == "vug ${VUG_TAG#v}" ]]
      - name: Build packages
        env:
          PACKAGES: ${{ toJSON(matrix.packages) }}
          CHANGED_PACKAGES: ${{ needs.plan.outputs.changed }}
          VUG_BUILD_JOBS: "3"
        run: python3 .github/scripts/package-builds.py build
      - name: Export unpublished outputs without signatures
        env:
          PACKAGES: ${{ toJSON(matrix.packages) }}
          REPLACE_ARCHIVES: ${{ inputs.replace-archives }}
        run: python3 .github/scripts/package-builds.py cache-shard
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cache-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/cache-shard/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    needs: [plan, build]
    runs-on: ubuntu-26.04
    environment: dev
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check that master contains the commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/package-builds.py cache-current
      - name: Check out the retained trees
        env:
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/package-builds.py cache-checkout
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: cache-shard-*
          path: ${{ runner.temp }}/cache-shards
      - uses: cachix/install-nix-action@v32.0.0
      - name: Set up vug
        env:
          GH_TOKEN: ${{ github.token }}
          VUG_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/vug/bin"
          gh release download "$VUG_TAG" --repo conao3/rust-vug \
            --pattern "vug-${VUG_TAG#v}-x86_64-linux-musl.tar.gz" --output - |
            tar -xz -C "$RUNNER_TEMP/vug/bin" vug
          [[ "$("$RUNNER_TEMP/vug/bin/vug" --version)" == "vug ${VUG_TAG#v}" ]]
      - name: Merge the shard exports
        id: merge
        run: python3 .github/scripts/package-builds.py cache-merge
      - name: Sign the merged output index
        env:
          VUG_CACHE_SIGNING_KEY: ${{ secrets.VUG_CACHE_SIGNING_KEY }}
          ENTRIES: ${{ steps.merge.outputs.entries }}
        run: |
          umask 077
          keyfile=$(mktemp "$RUNNER_TEMP/vug-signing.XXXXXX")
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$VUG_CACHE_SIGNING_KEY" > "$keyfile"
          unset VUG_CACHE_SIGNING_KEY
          keys=$("$RUNNER_TEMP/vug/bin/vug" --output json store export-cache \
            --directory "$RUNNER_TEMP/generated-cache" --data-dir "$RUNNER_TEMP/cache-export-index" \
            --secret-key-file "$keyfile" | jq .Keys)
          echo "Signed $keys keys for $ENTRIES index entries"
          [[ "$keys" == "$ENTRIES" ]]
      - name: Publish within the byte limit
        shell: bash
        env:
          VUG_CACHE_S3_ENDPOINT: ${{ secrets.VUG_CACHE_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.VUG_CACHE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VUG_CACHE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          REPLACE_ARCHIVES: ${{ inputs.replace-archives }}
          NO_PRUNE: ${{ inputs.no-prune }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ "${VUG_CACHE_S3_ENDPOINT%/}" =~ ^(https://[^/]+)/([a-z0-9][a-z0-9.-]*)$ ]]; then
            export VUG_CACHE_S3_ENDPOINT="${BASH_REMATCH[1]}"
            export VUG_CACHE_BUCKET="${BASH_REMATCH[2]}"
          else
            echo "Configure the S3 endpoint secret as an HTTPS endpoint followed by the bucket name" >&2
            exit 1
          fi
          mode=(--apply)
          [[ "$NO_PRUNE" == true ]] && mode+=(--no-prune)
          [[ "$DRY_RUN" == true ]] && mode=()
          replace=()
          for id in $REPLACE_ARCHIVES; do
            replace+=(--replace-archive "$id")
          done
          nix shell --impure --expr 'let pkgs = import (builtins.getFlake "nixpkgs") { system = builtins.currentSystem; }; in pkgs.python3.withPackages (p: [ p.boto3 ])' \
            --command python3 .github/scripts/cache-publish.py --s3 "${mode[@]}" --keep 2 \
            --repository "$RUNNER_TEMP/candidate" --repository "$RUNNER_TEMP/previous" \
            --vug "$RUNNER_TEMP/vug/bin/vug" \
            "${replace[@]}" \
            --generation "$RUNNER_TEMP/generated-cache" --trusted-key "$VUG_CACHE_PUBLIC_KEY"
