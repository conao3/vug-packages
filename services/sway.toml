name = "sway"
packages = [
  "dejavu-fonts",
  "fontconfig",
  "foot",
  "grim",
  "i3blocks",
  "slurp",
  "sway",
  "swaybg",
  "swayidle",
  "swaylock",
  "wl-clipboard",
  "wmenu",
  "xkeyboard-config",
]

[parameter.user]

[parameter.tty]
default = "tty1"

[parameter.renderer]
default = "pixman"

[[file]]
path = "/etc/fonts/fonts.conf"
target = "{pkg:fontconfig}/.vug/root/etc/fonts/fonts.conf"

[[file]]
path = "/etc/sway/config"
content = """
set $mod Mod4
output * bg #20304a solid_color
bindsym $mod+d exec wmenu-run
bindsym $mod+Return exec foot
bindsym $mod+Shift+q kill
bindsym $mod+Shift+e exit
bindsym $mod+l exec swaylock -f -c 101820
bindsym Print exec grim
bindsym $mod+Print exec sh -c 'grim -g "$(slurp)"'
bar {
  position top
  status_command i3blocks -c /etc/i3blocks.conf
}
exec swayidle -w timeout 600 'swaylock -f -c 101820' before-sleep 'swaylock -f -c 101820'
exec foot
"""

[[file]]
path = "/etc/i3blocks.conf"
content = """
[load]
command=cut -d' ' -f1-3 /proc/loadavg
interval=10

[memory]
command=sed -n 's/^MemAvailable: *\\([0-9]*\\)[0-9][0-9][0-9] kB/\\1 MB free/p' /proc/meminfo
interval=10

[time]
command=date '+%F %H:%M'
interval=30
"""

[[file]]
path = "/etc/pam.d/swaylock"
content = """
auth required pam_unix.so nullok
"""

[[file]]
path = "/etc/xdg/foot/foot.ini"
content = """
[main]
term=xterm-256color
font=DejaVu Sans Mono:size=12
"""

[[file]]
path = "/etc/systemd/system/sway.service"
content = """
[Unit]
Description=Sway on {param:tty}
After=systemd-user-sessions.service dbus.socket systemd-logind.service
Conflicts=getty@{param:tty}.service

[Service]
User={param:user}
PAMName=login
TTYPath=/dev/{param:tty}
TTYReset=yes
TTYVHangup=yes
StandardInput=tty-fail
StandardOutput=journal
StandardError=journal
UtmpIdentifier={param:tty}
UtmpMode=user
Environment=XDG_SESSION_TYPE=wayland
Environment=WLR_RENDERER={param:renderer}
Environment=XDG_CONFIG_DIRS=/etc/xdg
ExecStart=/bin/sway -c /etc/sway/config
Restart=no
"""

[[file]]
path = "/etc/systemd/system/multi-user.target.d/sway.conf"
content = """
[Unit]
Wants=sway.service
"""
