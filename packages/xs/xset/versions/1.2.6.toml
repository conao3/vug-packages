version = "1.2.6"

[source]
url = "https://www.x.org/releases/individual/app/xset-1.2.6.tar.xz"
sha256 = "623837349ea887bc003f01ee2e4b6b8ddd9c2774f632c6d70eead1b56306b695"

[build]
kind = "autotools"
configure-flags = [
  "--without-fontcache",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
  "xorgproto",
]
run = [
  "libx11",
  "libxext",
  "libxmu",
  "musl",
]

[check]
enabled = true
skip = []
