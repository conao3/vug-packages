version = "23.7"

[source]
url = "https://downloads.sourceforge.net/project/psmisc/psmisc/psmisc-23.7.tar.xz"
sha256 = "58c55d9c1402474065adae669511c191de374b0871eec781239ab400b907c327"

[build]
kind = "autotools"
configure-flags = [
  "--disable-nls",
  "ac_cv_lib_tinfo_tgetent=yes",
]
make-flags = [
  "src_pstree_LDADD=-ltinfow",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
  "ncurses",
]

[check]
enabled = true
skip = []
