version = "2.16.0"

[source]
url = "https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.16.0.tar.xz"
sha256 = "6a33dc555cc9ba8b10caf7695878ef134eeb36d0af366041f639b1da9b6ed220"

[build]
kind = "autotools"
configure-flags = [
  "--disable-nls",
  "--disable-docs",
  "--sysconfdir=/etc",
  "--localstatedir=/var",
  "--with-default-fonts=/usr/share/fonts",
]

[dependencies]
build = [
  "binutils",
  "gperf",
  "make",
  "pkgconf",
  "python",
]
run = [
  "expat",
  "freetype",
  "musl",
]

[check]
enabled = false
skip = []
