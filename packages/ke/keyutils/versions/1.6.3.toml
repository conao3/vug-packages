version = "1.6.3"
patches = [
  "1.6.3-relative-development-library.patch",
]

[source]
url = "https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/snapshot/keyutils-1.6.3.tar.gz"
sha256 = "a61d5706136ae4c05bd48f86186bcfdbd88dd8bd5107e3e195c924cfc1b39bb4"

[build]
kind = "make"
make-flags = [
  "CC=cc",
  "CFLAGS=-g -Wall -Werror -Wno-error=unused-function",
  "CXX=true",
  "DESTDIR={out}",
  "BINDIR=/bin",
  "SBINDIR=/sbin",
  "LIBDIR=/lib",
  "USRLIBDIR=/lib",
  "INCLUDEDIR=/include",
  "SHAREDIR=/share/keyutils",
  "MANDIR=/share/man",
  "ETCDIR=/etc",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "coreutils",
  "linux-headers",
  "make",
  "sed",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
