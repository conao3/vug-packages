version = "15.2.0"

[source]
url = "https://github.com/harfbuzz/harfbuzz/releases/download/15.2.0/harfbuzz-15.2.0.tar.xz"
sha256 = "e2ec49090744383cdbe7df808c1cedaafba06a97be8dc4211fe546ba585f12cb"

[build]
kind = "meson"
setup-flags = [
  "-Dtests=disabled",
  "-Ddocs=disabled",
  "-Dglib=enabled",
  "-Dfreetype=enabled",
  "-Dcairo=disabled",
  "-Dicu=disabled",
  "-Dintrospection=disabled",
  "-Dbenchmark=disabled",
  "-Dutilities=disabled",
]

[dependencies]
build = [
  "binutils",
  "meson",
  "pkgconf",
  "python",
  "samurai",
]
run = [
  "freetype",
  "glib",
  "musl",
]

[check]
enabled = false
skip = []
