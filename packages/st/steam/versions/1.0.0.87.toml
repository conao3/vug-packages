version = "1.0.0.87"

[source]
url = "https://repo.steampowered.com/steam/archive/stable/steam_1.0.0.87.tar.gz"
sha256 = "649375d2f9377f8009aaf3e2ff09978041eb9114897d9c5a3886f1d82e27ba1f"

[build]
kind = "prebuilt"
install = [
  { from = "bin_steam.sh", to = "bin/steam" },
  { from = "bootstraplinux_ubuntu12_32.tar.xz", to = "bin/bootstraplinux_ubuntu12_32.tar.xz" },
  { from = "steam.desktop", to = "share/applications/steam.desktop" },
  { from = "steam_subscriber_agreement.txt", to = "share/licenses/steam/steam_subscriber_agreement.txt" },
]

[dependencies]
build = []
run = []

[check]
enabled = false
skip = []

[fhs]
program = "bin/steam"
runtime-x86_64 = [
  { output = "nix-bash:out", from = "bin/bash", to = "usr/bin/bash" },
  { output = "nix-busybox:out", from = "bin/awk", to = "usr/bin/awk" },
  { output = "nix-busybox:out", from = "bin/basename", to = "usr/bin/basename" },
  { output = "nix-busybox:out", from = "bin/cat", to = "usr/bin/cat" },
