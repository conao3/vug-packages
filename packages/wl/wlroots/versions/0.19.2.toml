version = "0.19.2"

[source]
url = "https://gitlab.freedesktop.org/wlroots/wlroots/-/releases/0.19.2/downloads/wlroots-0.19.2.tar.gz"
sha256 = "09a0a8d60104c8b0772fee4f60ba76a89aed7e59dff7659d00960fba06bdf267"

[build]
kind = "meson"
setup-flags = [
  "-Dxwayland=disabled",
  "-Dexamples=false",
  "-Drenderers=",
  "-Dbackends=drm,libinput",
  "-Dallocators=",
  "-Dxcb-errors=disabled",
  "-Dsession=enabled",
  "-Dwerror=false",
]

[dependencies]
build = [
  "binutils",
  "hwdata",
  "linux-headers",
  "meson",
  "pkgconf",
  "python",
  "samurai",
  "wayland-protocols",
]
run = [
  "libdisplay-info",
  "libdrm",
  "libinput",
  "libxkbcommon",
  "musl",
  "pixman",
  "seatd",
  "systemd",
  "wayland",
]

[check]
enabled = false
skip = []
