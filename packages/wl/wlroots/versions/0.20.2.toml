version = "0.20.2"

[source]
url = "https://gitlab.freedesktop.org/wlroots/wlroots/-/releases/0.20.2/downloads/wlroots-0.20.2.tar.gz"
sha256 = "80c567d2ed4efb2cfa6b077f22c7a710d9c78ba4e185a75e8694001114af0733"

[build]
kind = "meson"
setup-flags = [
  "-Dxwayland=disabled",
  "-Dexamples=false",
  "-Drenderers=gles2",
  "-Dbackends=drm,libinput",
  "-Dallocators=gbm",
  "-Dxcb-errors=disabled",
  "-Dsession=enabled",
  "-Dwerror=false",
]

[dependencies]
build = [
  "binutils",
  "hwdata",
  "linux-headers",
  "meson",
  "pkgconf",
  "python",
  "samurai",
  "wayland-protocols",
]
run = [
  "libdisplay-info",
  "libdrm",
  "libinput",
  "libxkbcommon",
  "mesa",
  "musl",
  "pixman",
  "seatd",
  "systemd",
  "wayland",
]

[check]
enabled = false
skip = []
