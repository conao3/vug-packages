version = "2.2.1"
patches = [
  "2.2.1-c++17-no-auto_ptr-fix.patch",
  "2.2.1-c++17-register-fix.patch",
  "2.2.1-gcc15-template.patch",
]

[source]
url = "https://downloads.sourceforge.net/mjpeg/mjpegtools-2.2.1.tar.gz"
sha256 = "b180536d7d9960b05e0023a197b00dcb100929a49aab71d19d55f4a1b210f49a"

[build]
kind = "autotools"
configure-flags = [
  "--without-dga",
  "--without-gtk",
  "--without-libquicktime",
  "--without-libsdl",
  "--without-sdlgfx",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "libcxx",
  "libdv",
  "libjpeg-turbo",
  "libpng",
  "musl",
]

[check]
enabled = true
skip = []
