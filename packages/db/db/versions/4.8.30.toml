version = "4.8.30"

[source]
url = "https://download.oracle.com/berkeley-db/db-4.8.30.tar.gz"
sha256 = "e0491a07cdb21fb9aa82773bbbedaeb7639cbd0e7f96147ab46141e0045db72a"

[build]
kind = "autotools"
path = "build_unix"
configure-command = [
  "sh",
  "-c",
  "cp {dep:automake}/share/automake-1.20/config.sub ../dist/config.sub && cp {dep:automake}/share/automake-1.20/config.guess ../dist/config.guess && ../dist/configure --prefix={out} --with-mutex=POSIX/pthreads lt_cv_sys_max_cmd_len=-1",
]

[dependencies]
build = [
  "automake",
  "binutils",
  "make",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
