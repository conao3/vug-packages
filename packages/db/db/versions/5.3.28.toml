version = "5.3.28"

[source]
url = "https://download.oracle.com/berkeley-db/db-5.3.28.tar.gz"
sha256 = "e0a992d740709892e81f9d93f06daf305cf73fb81b545afe72478043172c3628"

[build]
kind = "autotools"
path = "build_unix"
configure-command = [
  "sh",
  "-c",
  "cp {dep:automake}/share/automake-1.20/config.sub ../dist/config.sub && cp {dep:automake}/share/automake-1.20/config.guess ../dist/config.guess && ../dist/configure --prefix={out} --with-mutex=POSIX/pthreads lt_cv_sys_max_cmd_len=-1",
]

[dependencies]
build = [
  "automake",
  "binutils",
  "make",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
