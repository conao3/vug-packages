version = "1.4.363.0"

[source]
url = "https://github.com/KhronosGroup/Vulkan-Loader/archive/vulkan-sdk-1.4.363.0.tar.gz"
sha256 = "941eff558fc74f248745fb7df367640cf89a8457f216dae498a74ae14b6ba6f7"

[build]
kind = "cmake"
setup-flags = [
  "-DBUILD_WSI_DIRECTFB_SUPPORT=OFF",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
  "pkgconf",
  "vulkan-headers",
]
run = [
  "libx11",
  "libxcb",
  "libxrandr",
  "musl",
  "wayland",
]

[check]
enabled = false
skip = []
