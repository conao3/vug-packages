version = "1.18.0"

[source]
url = "https://github.com/google/googletest/archive/refs/tags/v1.18.0.tar.gz"
sha256 = "6e3191c1455468b3fc35a417fb565c1c5071aee1b7e7f85e30cf48a98d37d8b5"

[build]
kind = "cmake"
setup-flags = [
  "-DBUILD_SHARED_LIBS=ON",
  "-DBUILD_GMOCK=ON",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
]
run = [
  "libcxx",
  "musl",
]

[check]
enabled = true
skip = []
