version = "1.5"

[source]
url = "https://github.com/vivien/i3blocks/archive/refs/tags/1.5.tar.gz"
sha256 = "41764d771043d0c06c23d75b1e3ca6b2b94279191483d03f10c5e034d6722ebf"

[build]
kind = "autotools"
configure-command = [
  "sh",
  "-c",
  "autoreconf -fi && ./configure --prefix={out}",
]

[dependencies]
build = [
  "autoconf",
  "automake",
  "binutils",
  "m4",
  "make",
  "perl",
  "pkgconf",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
