version = "2.3.5"

[source]
url = "https://github.com/OCL-dev/ocl-icd/archive/refs/tags/v2.3.5.tar.gz"
sha256 = "cdd7984425fa92d37273eee4180b5f57b047eda6dd8fd623e58498f844b09b75"

[build]
kind = "autotools"
autoreconf = true
configure-flags = [
  "--enable-custom-layerdir",
  "--enable-custom-vendordir",
  "--enable-official-khronos-headers",
]

[dependencies]
build = [
  "autoconf",
  "automake",
  "binutils",
  "libtool",
  "make",
  "ruby",
]
run = [
  "musl",
]

[check]
enabled = true
skip = []
