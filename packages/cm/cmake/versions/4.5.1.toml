version = "4.5.1"

[source]
url = "https://github.com/Kitware/CMake/releases/download/v4.5.1/cmake-4.5.1.tar.gz"
sha256 = "a79bf33cbe05686fdf79c2bbbcfe5e8e62ad16d3d540fa737cbedfeed41fb69e"

[build]
kind = "autotools"
configure-flags = [
  "--parallel=5",
  "--no-system-libs",
  "--",
  "-DCMAKE_USE_OPENSSL=OFF",
  "-DCMAKE_PREFIX_PATH={dep:musl}",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "coreutils",
  "diffutils",
  "findutils",
  "gawk",
  "grep",
  "linux-headers",
  "make",
  "sed",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
