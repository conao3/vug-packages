version = "1.86.0"
patches = [
  "1.86.0-distutils-fallback.patch",
  "1.86.0-musl-ldd.patch",
  "1.86.0-test-ccompiler-distutils.patch",
  "1.86.0-pin-tool-runtime-modules.patch",
]

[source]
url = "https://download.gnome.org/sources/gobject-introspection/1.86/gobject-introspection-1.86.0.tar.xz"
sha256 = "920d1a3fcedeadc32acff95c2e203b319039dd4b4a08dd1a2dfd283d19c0b9ae"

[build]
kind = "meson"
setup-flags = [
  "-Dcairo=enabled",
  "-Ddoctool=enabled",
]

[dependencies]
build = [
  "binutils",
  "bison",
  "cairo",
  "flex",
  "glib",
  "libffi",
  "mako",
  "meson",
  "pkgconf",
  "python",
  "python-markdown",
  "python-setuptools",
  "samurai",
]
run = [
  "glib",
  "libffi",
  "mako",
  "musl",
  "python",
  "python-markdown",
  "python-setuptools",
]
expose = [
  "glib",
]

[check]
enabled = true
skip = [
  "gi-tester-Bar-1.0.gir",
  "gi-tester-Bar-1.0.typelib",
  "gi-tester-GetType-1.0.gir",
  "gi-tester-GetType-1.0.typelib",
  "gi-tester-GtkFrob-1.0.gir",
  "gi-tester-GtkFrob-1.0.typelib",
  "gi-tester-Headeronly-1.0.gir",
  "gi-tester-Headeronly-1.0.typelib",
  "gi-tester-Identfilter-1.0.gir",
  "gi-tester-Identfilter-1.0.typelib",
  "gi-tester-Regress-1.0.gir",
  "gi-tester-Regress-1.0.typelib",
  "gi-tester-RegressUnix-1.0.gir",
  "gi-tester-RegressUnix-1.0.typelib",
  "gi-tester-SLetter-1.0.gir",
  "gi-tester-SLetter-1.0.typelib",
  "gi-tester-Symbolfilter-1.0.gir",
  "gi-tester-Symbolfilter-1.0.typelib",
  "gi-tester-Typedefs-1.0.gir",
  "gi-tester-Typedefs-1.0.typelib",
  "gi-tester-Utility-1.0.gir",
  "gi-tester-Utility-1.0.typelib",
  "gi-tester-WarnLib-1.0.gir",
  "gi-tester-WarnLib-1.0.typelib",
  "gi-tester-docs-Regress-1.0-C",
  "gi-tester-docs-Regress-1.0-Gjs",
  "gi-tester-docs-Regress-1.0-Python",
  "gi-tester-docs-Regress-1.0-sections.txt",
  "gi-testerEverything-1.0.typelib",
  "gi-testerGIMarshallingTests-1.0.typelib",
  "giteststructinfo",
  "gitestthrows",
  "gitypelibtest",
  "test_offsets.py",
]
