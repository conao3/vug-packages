version = "0.0.23"
patches = [
  "0.0.23-pkg-config-consumers.patch",
]

[source]
url = "https://github.com/nodejs/uvwasi/archive/refs/tags/v0.0.23.tar.gz"
sha256 = "cdb148aac298883b51da887657deca910c7c02f35435e24f125cef536fe8d5e1"

[build]
kind = "cmake"
setup-flags = [
  "-DCMAKE_C_FLAGS_RELEASE=-O3 -UNDEBUG",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
]
run = [
  "libuv",
  "musl",
]

[check]
enabled = true
skip = [
  "test-sock-send-recv",
]
