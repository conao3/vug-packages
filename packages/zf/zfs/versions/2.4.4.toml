version = "2.4.4"
patches = [
  "2.4.4-libzstd-wp-w.patch",
]

[source]
url = "https://github.com/openzfs/zfs/releases/download/zfs-2.4.4/zfs-2.4.4.tar.gz"
sha256 = "2a3c70d55a37cc71618a95a60e81ad66530201eb118d37741dc92efcf848c8b1"

[build]
kind = "autotools"
configure-flags = [
  "--disable-sysvinit",
  "--enable-pam",
  "--with-config=user",
  "--with-tirpc",
  "--without-libunwind",
  "LDFLAGS=-Wl,--no-gc-sections",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
  "python",
]
run = [
  "gettext",
  "libaio",
  "libtirpc",
  "linux-pam",
  "musl",
  "nfs-utils",
  "openssl",
  "python",
  "systemd",
  "util-linux",
  "zlib",
]

[check]
enabled = true
skip = []
