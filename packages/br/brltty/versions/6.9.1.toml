version = "6.9.1"
patches = [
  "6.9.1-check-programs.patch",
]

[source]
url = "https://brltty.app/archive/brltty-6.9.1.tar.xz"
sha256 = "cf4619ce1471690e4ecc5544ee6289cef6c5bdf5855a1ac8dcc63f5beedf108d"

[build]
kind = "autotools"
configure-flags = [
  "--disable-java-bindings",
  "--disable-liblouis",
  "--disable-lisp-bindings",
  "--disable-ocaml-bindings",
  "--disable-speech-support",
  "brltty_cv_prog_conflibdir=:",
  "--disable-emacs-bindings",
]
install-flags = [
  "INSTALL_ROOT=$(DESTDIR)",
  "PYTHON_PREFIX=$(prefix)",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
  "python-cython",
  "python-setuptools",
  "tcl",
]
run = [
  "acl",
  "alsa-lib",
  "bluez",
  "expat",
  "gpm",
  "icu4c",
  "libcap",
  "libx11",
  "libxaw",
  "libxext",
  "libxfixes",
  "libxt",
  "libxtst",
  "lua",
  "musl",
  "ncurses",
  "polkit",
  "python",
  "systemd",
  "tcl",
]

[check]
enabled = true
skip = []
