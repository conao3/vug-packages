version = "0.9.17"

[source]
url = "https://github.com/LibVNC/x11vnc/archive/refs/tags/0.9.17.tar.gz"
sha256 = "3ab47c042bc1c33f00c7e9273ab674665b85ab10592a8e0425589fe7f3eb1a69"

[build]
kind = "autotools"
autoreconf = true
configure-flags = [
  "CFLAGS=-O2 -I{dep:libdrm}/include/libdrm",
  "--without-xtrap",
]

[dependencies]
build = [
  "autoconf",
  "automake",
  "binutils",
  "libtool",
  "linux-headers",
  "make",
  "pkgconf",
]
run = [
  "avahi",
  "cairo",
  "coreutils",
  "libdrm",
  "libjpeg-turbo",
  "libvncserver",
  "libx11",
  "libxcomposite",
  "libxcrypt",
  "libxcursor",
  "libxdamage",
  "libxext",
  "libxfixes",
  "libxi",
  "libxinerama",
  "libxrandr",
  "libxtst",
  "musl",
  "openssl",
  "xauth",
  "zlib",
]

[check]
enabled = true
skip = []
