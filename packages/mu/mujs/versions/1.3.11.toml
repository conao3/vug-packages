version = "1.3.11"

[source]
url = "https://mujs.com/downloads/mujs-1.3.11.tar.gz"
sha256 = "456a395769daf110a30f9bf6f793044261e261481d5dca33b63cdc8714774ca4"

[build]
kind = "make"
make-flags = [
  "CC=cc",
  "VERSION=1.3.11",
  "prefix={out}",
]
build-targets = [
  "release",
]
install-targets = [
  "install-static",
  "install-shared",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
  "readline",
]

[check]
enabled = false
skip = []
