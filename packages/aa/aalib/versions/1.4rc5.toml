version = "1.4rc5"
patches = [
  "1.4rc5-ltconfig-rpath.patch",
  "1.4rc5-ncurses-window-access.patch",
  "1.4rc5-rawmode-init-return.patch",
]

[source]
url = "https://downloads.sourceforge.net/aa-project/aalib-1.4rc5.tar.gz"
sha256 = "fbddda9230cf6ee2a4f5706b4b11e2190ae45f5eda1f0409dc4f99b35e0a70ee"

[build]
kind = "autotools"
configure-command = [
  "sh",
  "-c",
  "sed -i 's/-lncurses/-lncursesw -ltinfow/g; s@/usr/include/slang@{dep:slang}/include/slang@g; s@/usr/lib/slang@{dep:slang}/lib@g' configure && CC='cc -std=gnu89 -Wno-error' ./configure --prefix={out} --with-curses-driver=yes --with-ncurses={dep:ncurses} --x-includes={dep:libx11}/include --x-libraries={dep:libx11}/lib",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "libx11",
  "musl",
  "ncurses",
  "slang",
]

[check]
enabled = true
skip = []
