version = "26.3.1"
patches = [
  "26.3.1-find-split-clang-resources.patch",
]

[source]
url = "https://archive.mesa3d.org/mesa-26.3.1.tar.xz"
sha256 = "4e4e438eac7b840a9383988cbb7c08dad8041da544b9319fc26d319fa7348961"

[build]
kind = "meson"
setup-flags = [
  "-Dsysconfdir=/etc",
  "-Dgallium-drivers=llvmpipe,virgl,zink,radeonsi,iris,crocus",
  "-Dvulkan-drivers=",
  "-Dllvm=enabled",
  "-Dmesa-clc-bundle-headers=enabled",
  "-Dstrip=true",
  "-Dcpp_rtti=false",
  "-Dplatforms=wayland",
  "-Dglx=disabled",
  "-Degl=enabled",
  "-Dgbm=enabled",
  "-Dgles2=enabled",
  "-Dopengl=true",
  "-Dvalgrind=disabled",
  "-Dlibunwind=disabled",
  "-Dzstd=enabled",
]

[dependencies]
build = [
  "binutils",
  "bison",
  "flex",
  "linux-headers",
  "llvm:dev",
  "llvm:tools",
  "mako",
  "markupsafe",
  "meson",
  "packaging",
  "pkgconf",
  "python",
  "pyyaml",
  "samurai",
  "wayland-protocols",
]
run = []

[outputs.dev]
paths = [
  "include",
  "lib/libEGL.so",
  "lib/libGLESv1_CM.so",
  "lib/libGLESv2.so",
  "lib/libgbm.so",
  "lib/pkgconfig",
]
run = [
  ":out",
]

[outputs.out]
run = [
  "elfutils",
  "expat",
  "libcxx",
  "libdrm",
  "llvm:lib",
  "musl",
  "spirv-llvm-translator",
  "spirv-tools",
  "wayland",
  "zlib",
  "zstd",
]

[check]
enabled = false
skip = []
