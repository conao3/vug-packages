version = "23.1.6"

[source]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.6/llvm-project-23.1.6.src.tar.xz"
sha256 = "d3b86ab29cfb4445a6652e5c2642ccc75e04e38084dde3701d323320f35a31da"

[build]
kind = "cmake"
setup-flags = [
  "-S",
  "llvm",
  "-DLLVM_TARGETS_TO_BUILD=X86",
  "-DLLVM_ENABLE_PROJECTS=",
  "-DLLVM_BUILD_LLVM_DYLIB=ON",
  "-DLLVM_LINK_LLVM_DYLIB=ON",
  "-DLLVM_INCLUDE_TESTS=OFF",
  "-DLLVM_INCLUDE_BENCHMARKS=OFF",
  "-DLLVM_INCLUDE_EXAMPLES=OFF",
  "-DLLVM_ENABLE_ZSTD=OFF",
  "-DLLVM_ENABLE_LIBXML2=OFF",
  "-DLLVM_HOST_TRIPLE=x86_64-unknown-linux-musl",
  "-DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-unknown-linux-musl",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "linux-headers",
  "make",
  "python",
]
run = [
  "musl",
  "zlib",
]

[check]
enabled = false
skip = []
