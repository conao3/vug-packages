version = "3.15.0"

[source]
url = "https://cdn.kernel.org/pub/software/utils/pciutils/pciutils-3.15.0.tar.xz"
sha256 = "c02940f430841ecf158d5d9a50007afc4d5353c8678a2455003ca0b2c4e9f5ff"

[build]
kind = "make"
make-flags = [
  "PREFIX={out}",
  "CC=cc",
  "AR=ar",
  "STRIP=",
  "SHARED=yes",
  "ZLIB=yes",
  "DNS=no",
  "HWDB=no",
  "LIBKMOD=no",
]
install-targets = [
  "install",
  "install-lib",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "coreutils",
  "gawk",
  "grep",
  "linux-headers",
  "make",
  "sed",
]
run = [
  "musl",
  "zlib",
]

[check]
enabled = false
skip = []
