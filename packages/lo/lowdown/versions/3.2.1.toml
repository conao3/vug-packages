version = "3.2.1"
patches = [
  "3.2.1-makefile-gnumake.patch",
]

[source]
url = "https://kristaps.bsd.lv/lowdown/snapshots/lowdown-3.2.1.tar.gz"
sha256 = "664afc7c00aadbaf16cdcf7dc464e64b529f432eba9dffc950acb0d55d1be90d"

[build]
kind = "autotools"
configure-command = [
  "./configure",
  "PREFIX={out}",
  "LINKER_SOFLAG=-shared",
  "LINKER_SOSUFFIX=so",
]
install-targets = [
  "install",
  "install_libs",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
]

[check]
enabled = true
skip = []
target = "regress"
