version = "1.18.6"

[source]
url = "https://cairographics.org/releases/cairo-1.18.6.tar.xz"
sha256 = "1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4"

[build]
kind = "meson"
setup-flags = [
  "-Dtests=disabled",
  "-Dxlib=enabled",
  "-Dxcb=enabled",
  "-Dglib=enabled",
  "-Dfontconfig=enabled",
  "-Dfreetype=enabled",
  "-Dpng=enabled",
  "-Dzlib=enabled",
  "-Ddwrite=disabled",
  "-Dgtk_doc=false",
  "-Dspectre=disabled",
  "-Dsymbol-lookup=disabled",
]

[dependencies]
build = [
  "binutils",
  "meson",
  "pkgconf",
  "python",
  "samurai",
  "xorgproto",
]
run = [
  "fontconfig",
  "freetype",
  "glib",
  "libpng",
  "libx11",
  "libxcb",
  "libxext",
  "libxrender",
  "musl",
  "pixman",
  "zlib",
]

[check]
enabled = false
skip = []
