version = "4.0.5"

[source]
url = "https://downloads.sourceforge.net/project/procps-ng/Production/procps-ng-4.0.5.tar.xz"
sha256 = "c2e6d193cc78f84cd6ddb72aaf6d5c6a9162f0470e5992092057f5ff518562fa"

[build]
kind = "autotools"
configure-flags = [
  "--disable-nls",
  "--without-systemd",
  "--disable-kill",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "musl",
  "ncurses",
]

[check]
enabled = false
skip = []
