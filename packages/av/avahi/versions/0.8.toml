version = "0.8"

[source]
url = "https://github.com/lathiat/avahi/releases/download/v0.8/avahi-0.8.tar.gz"
sha256 = "060309d7a333d38d951bc27598c677af1796934dbd98e1024e7ad8de798fedda"

[build]
kind = "autotools"
configure-flags = [
  "--enable-nls",
  "LIBS=-lintl",
  "--with-distro=none",
  "ac_cv_prog_have_pkg_config=yes",
  "--disable-gtk",
  "--disable-gtk3",
  "--disable-qt4",
  "--disable-qt5",
  "--disable-python",
  "--disable-pygobject",
  "--disable-python-dbus",
  "--disable-mono",
  "--disable-monodoc",
  "--disable-doxygen-doc",
  "--disable-xmltoman",
  "--enable-tests",
]

[dependencies]
build = [
  "binutils",
  "linux-headers",
  "make",
  "pkgconf",
  "python",
]
run = [
  "dbus",
  "expat",
  "gdbm",
  "gettext",
  "glib",
  "libcap",
  "libdaemon",
  "libevent",
  "musl",
]

[check]
enabled = true
skip = []
