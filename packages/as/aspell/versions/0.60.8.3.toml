version = "0.60.8.3"

[source]
url = "https://ftp.gnu.org/gnu/aspell/aspell-0.60.8.3.tar.gz"
sha256 = "0534eae11132405120d11e46bf595bd5dd189bc124ba77a5dd6aae861b48a162"

[build]
kind = "autotools"
configure-flags = [
  "--enable-curses=-lncursesw -ltinfow",
]

[dependencies]
