version = "5.4.1"
patches = [
  "5.4.1-node-struct-without-mpfr.patch",
]

[source]
url = "https://ftp.gnu.org/gnu/gawk/gawk-5.4.1.tar.xz"
sha256 = "07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"

[build]
kind = "autotools"
configure-flags = [
  "--disable-nls",
  "--without-readline",
  "--without-mpfr",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
