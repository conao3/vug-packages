version = "1.3.5"

[source]
url = "https://www.x.org/releases/individual/app/setxkbmap-1.3.5.tar.xz"
sha256 = "360193cecc93f906d8383a8fb5c1f3a7eed35e6ced0e118a64ee56ae13c88cac"

[build]
kind = "autotools"
configure-flags = [
  "--with-xkb-config-root={dep:xkeyboard-config}/share/xkeyboard-config-2",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "libx11",
  "libxkbfile",
  "libxrandr",
  "musl",
  "xkeyboard-config",
]

[check]
enabled = true
skip = []
