version = "3.18.3"

[source]
url = "https://github.com/libfuse/libfuse/releases/download/fuse-3.18.3/fuse-3.18.3.tar.gz"
sha256 = "bcd19582c5e30f7fe45dd86a5540e998590aa01903afc7ebcbeea6c8ac5421ee"

[build]
kind = "meson"
setup-flags = [
  "-Dsysconfdir=/etc",
  "-Dexamples=false",
  "-Dinitscriptdir=",
  "-Duseroot=false",
]

[dependencies]
build = [
  "binutils",
  "meson",
  "pkgconf",
  "python",
  "samurai",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
