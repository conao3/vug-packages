version = "7.3.0"

[source]
url = "https://cdn.kernel.org/pub/linux/utils/net/iproute2/iproute2-7.3.0.tar.xz"
sha256 = "5c1789d290bba048a6135ed1ab81b0402dd0fb528d1f1421765c42b1fc3d6289"

[build]
kind = "make"
make-flags = [
  "PREFIX={out}",
  "SBINDIR={out}/sbin",
  "KERNEL_INCLUDE={dep:linux-headers}/include",
  "LIBDIR={out}/lib",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "bison",
  "coreutils",
  "flex",
  "linux-headers",
  "make",
  "pkgconf",
  "sed",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
