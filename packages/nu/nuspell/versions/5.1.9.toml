version = "5.1.9"

[source]
url = "https://github.com/nuspell/nuspell/archive/refs/tags/v5.1.9.tar.gz"
sha256 = "658a28d2c622b6da5271544043a5b7b3e09881be8516a23efc11c43971b4b046"

[build]
kind = "cmake"
setup-flags = [
  "-DBUILD_TESTING=OFF",
  "-DBUILD_DOCS=OFF",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
]
run = [
  "icu4c",
  "libcxx",
  "musl",
]

[check]
enabled = true
skip = []
