version = "0.46.4"

[source]
url = "https://www.cairographics.org/releases/pixman-0.46.4.tar.gz"
sha256 = "d09c44ebc3bd5bee7021c79f922fe8fb2fb57f7320f55e97ff9914d2346a591c"

[build]
kind = "meson"
setup-flags = [
  "-Dlibpng=disabled",
  "-Dgtk=disabled",
  "-Dopenmp=disabled",
  "-Ddemos=disabled",
]

[dependencies]
build = [
  "binutils",
  "meson",
  "pkgconf",
  "python",
  "samurai",
]
run = [
  "musl",
]

[check]
enabled = true
skip = []
