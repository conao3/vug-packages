version = "1.3.3"

[source]
url = "https://gnupg.org/ftp/gcrypt/pinentry/pinentry-1.3.3.tar.bz2"
sha256 = "c2970f16d6afb66ecddfca767d743936c86239bff936eed7fd7597a678414b63"

[build]
kind = "autotools"
configure-flags = [
  "--enable-pinentry-curses",
  "--enable-pinentry-tty",
  "--disable-pinentry-qt",
  "--disable-pinentry-gtk2",
  "--disable-pinentry-gnome3",
  "--disable-pinentry-emacs",
  "--disable-libsecret",
  "--with-libgpg-error-prefix={dep:libgpg-error}",
  "--with-libassuan-prefix={dep:libassuan}",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "libassuan",
  "libgpg-error",
  "musl",
  "ncurses",
]

[check]
enabled = false
skip = []
