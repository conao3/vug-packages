version = "3.54.1"

[source]
url = "https://www.sqlite.org/2026/sqlite-autoconf-3540100.tar.gz"
sha256 = "926ef8d3eab93fbf6e06011901273eec076b25594a4e1cdadd50c987f4f6d64e"

[build]
kind = "autotools"
configure-flags = [
  "--with-readline-header={dep:readline}/include/readline/readline.h",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
  "readline",
  "zlib",
]

[check]
enabled = false
skip = []
