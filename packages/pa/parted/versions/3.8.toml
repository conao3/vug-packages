version = "3.8"

[source]
url = "https://ftp.gnu.org/gnu/parted/parted-3.8.tar.xz"
sha256 = "a2b7811f47b0ddb1f7b1d0aa456f7c1270da70708ce231c2fe054c7199eafa63"

[build]
kind = "autotools"
configure-flags = [
  "--disable-device-mapper",
  "--disable-nls",
  "ac_cv_search_tgetent=-ltinfow",
]

[dependencies]
build = [
  "binutils",
  "linux-headers",
  "make",
  "pkgconf",
]
run = [
  "musl",
  "ncurses",
  "readline",
  "util-linux",
]

[check]
enabled = false
skip = []
