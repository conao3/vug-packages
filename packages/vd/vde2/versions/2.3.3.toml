version = "2.3.3"

[source]
url = "https://github.com/virtualsquare/vde-2/archive/v2.3.3.tar.gz"
sha256 = "a7d2cc4c3d0c0ffe6aff7eb0029212f2b098313029126dcd12dc542723972379"

[build]
kind = "autotools"
autoreconf = true
configure-flags = [
  "CFLAGS=-O2 -std=gnu17",
  "--disable-cryptcab",
]

[dependencies]
build = [
  "autoconf",
  "automake",
  "binutils",
  "libtool",
  "linux-headers",
  "make",
]
run = [
  "libpcap",
  "musl",
]

[check]
enabled = true
skip = []
