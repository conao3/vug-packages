version = "2.16.0"

[source]
url = "https://download.open-mpi.org/release/hwloc/v2.16/hwloc-2.16.0.tar.bz2"
sha256 = "ad05eb466b915a4f0e0228173d7e09974ac38760c38d5b6f060254c050fca12d"

[build]
kind = "autotools"
configure-flags = [
  "--disable-cairo",
  "--without-x",
  "--disable-opencl",
  "--disable-cuda",
  "--disable-nvml",
  "--disable-libudev",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
