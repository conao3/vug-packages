version = "1.9.17p2"

[source]
url = "https://www.sudo.ws/dist/sudo-1.9.17p2.tar.gz"
sha256 = "4a38a1ab3adb1199257edc2a7c4a2bd714665eb605b04368843b06dada2cfcfb"

[build]
kind = "autotools"
configure-flags = [
  "--disable-nls",
  "--with-pam",
  "--without-sendmail",
  "--with-env-editor",
  "--with-passprompt=[sudo] password for %p: ",
  "--disable-root-mailer",
  "--with-rundir=/run/sudo",
  "--with-vardir=/var/db/sudo",
  "--sysconfdir=/etc",
  "--localstatedir=/var",
]
install-flags = [
  "INSTALL_OWNER=",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "make",
]
run = [
  "linux-pam",
  "musl",
]

[check]
enabled = false
skip = []
