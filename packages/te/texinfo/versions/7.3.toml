version = "7.3"

[source]
url = "https://ftp.gnu.org/gnu/texinfo/texinfo-7.3.tar.xz"
sha256 = "51f74eb0f51cfa9873b85264dfdd5d46e8957ec95b88f0fb762f63d9e164c72e"

[build]
kind = "autotools"
configure-flags = [
  "--disable-nls",
  "--disable-perl-xs",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "coreutils",
  "diffutils",
  "findutils",
  "gawk",
  "grep",
  "make",
  "perl",
  "sed",
]
run = [
  "musl",
  "ncurses",
  "perl",
]

[check]
enabled = false
skip = []
