version = "1.2.4"
patches = [
  "1.2.4-perl-shebang.patch",
]

[source]
url = "https://downloads.sourceforge.net/project/hunspell/MyThes/1.2.4/mythes-1.2.4.tar.gz"
sha256 = "1e81f395d8c851c3e4e75b568e20fa2fa549354e75ab397f9de4b0e0790a305f"

[build]
kind = "autotools"
install-flags = [
  "PERL={dep:perl}/bin/perl",
]

[dependencies]
build = [
  "binutils",
  "hunspell",
  "make",
  "pkgconf",
]
run = [
  "libcxx",
  "musl",
  "perl",
]

[check]
enabled = true
skip = []
