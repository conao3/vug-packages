version = "4.4"

[source]
url = "https://cdn.kernel.org/pub/linux/utils/raid/mdadm/mdadm-4.4.tar.xz"
sha256 = "9b488f35ed153df99924b5fe41eed380e8512de8f18a118628cacdd681b1d573"

[build]
kind = "make"
make-flags = [
  "CC=cc",
  "CWFLAGS=",
  "CHECK_RUN_DIR=0",
  "CXFLAGS=-D_LARGEFILE64_SOURCE",
  "DESTDIR={out}",
  "BINDIR=/sbin",
  "MANDIR=/share/man",
  "UDEVDIR=/lib/udev",
  "SYSTEMD_DIR=/lib/systemd/system",
]
install-targets = [
  "install-bin",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "coreutils",
  "linux-headers",
  "make",
  "sed",
]
run = [
  "musl",
  "systemd",
]

[check]
enabled = false
skip = []
