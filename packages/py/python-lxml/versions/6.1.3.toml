version = "6.1.3"
patches = [
  "6.1.3-drop-cython-requirement.patch",
]

[source]
url = "https://files.pythonhosted.org/packages/source/l/lxml/lxml-6.1.3.tar.gz"
sha256 = "45222d94ddd511536f3b2f7d9deae3b2339b4ce0f075f1ca25703b07cad9dd21"

[build]
kind = "python"
native-imports = [
  "lxml.etree",
  "lxml.objectify",
]

[dependencies]
build = [
  "python-build",
  "python-installer",
  "python-setuptools",
]
run = [
  "libxml2",
  "libxslt",
  "musl",
  "python",
  "zlib",
]

[check]
enabled = true
skip = []
