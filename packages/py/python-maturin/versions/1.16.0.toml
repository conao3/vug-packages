version = "1.16.0"

[source]
url = "https://files.pythonhosted.org/packages/source/m/maturin/maturin-1.16.0.tar.gz"
sha256 = "13e69ca12542999d8c5467131de72a49bb76e4c284b9a45c5783df7c0fcb3a8a"

[build]
kind = "python"
imports = [
  "maturin",
]
cargo-lock = true

[dependencies]
build = [
  "binutils",
  "make",
  "python-build",
  "python-installer",
  "python-setuptools",
  "python-setuptools-rust",
  "python-wheel",
  "rust",
]
run = [
  "musl",
  "python",
  "rust-libunwind",
]

[check]
enabled = true
skip = []
