version = "2.50.5"

[source]
url = "https://files.pythonhosted.org/packages/source/p/pydantic-core/pydantic_core-2.50.5.tar.gz"
sha256 = "1e740886083ff95530d694e6a3f09ed914bcf92a496d16acd307c6c3484fc36d"

[build]
kind = "python"
imports = [
  "pydantic_core",
]
native-imports = [
  "pydantic_core._pydantic_core",
]
cargo-lock = true

[dependencies]
build = [
  "binutils",
  "make",
  "python-build",
  "python-installer",
  "python-maturin",
  "rust",
]
run = [
  "musl",
  "python",
  "python-typing-extensions",
  "rust-libunwind",
]

[check]
enabled = true
skip = []
