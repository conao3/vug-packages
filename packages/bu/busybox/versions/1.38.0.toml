version = "1.38.0"
patches = [
  "1.38.0-tc-cbq-removed-uapi.patch",
  "1.38.0-testsuite-env-skips.patch",
]

[source]
url = "https://busybox.net/downloads/busybox-1.38.0.tar.bz2"
sha256 = "34f9ea6ff8636f2c9241153b9114eefa9e65674a45318ae1ef95bb5f31c53bb2"

[build]
kind = "make"
make-flags = [
  "CC=cc",
]
install-flags = [
  "CONFIG_PREFIX={out}",
]
build-targets = [
  "defconfig",
  "all",
]

[dependencies]
build = [
  "binutils",
  "linux-headers",
  "make",
  "zip",
]
run = [
  "musl",
]

[check]
enabled = true
skip = []
