version = "1.89.0"

[source]
url = "https://archives.boost.io/release/1.89.0/source/boost_1_89_0.tar.bz2"
sha256 = "85a33fa22621b4f314f8e85e1a5e2a9363d22e4f4992925d4bb3bc631b5a0c7a"

[build]
kind = "commands"
commands = [
  ["./bootstrap.sh"],
  ["sh", "-ec", "printf '%s\\n' 'using gcc : : c++ ;' 'using python : : python3 ;' > project-config.jam"],
  ["./b2", "install", "--prefix={out}", "--layout=system", "link=shared", "variant=release", "threading=multi", "--without-mpi", "toolset=gcc", "pch=off", "-j3"],
]

[dependencies]
build = [
  "binutils",
  "which",
]
run = [
  "bzip2",
  "icu4c",
  "libcxx",
  "musl",
  "python",
  "xz",
  "zlib",
  "zstd",
]

[check]
enabled = false
skip = []
