version = "0.3.34"

[source]
url = "https://github.com/OpenMathLib/OpenBLAS/archive/refs/tags/v0.3.34.tar.gz"
sha256 = "cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed"

[build]
kind = "cmake"
setup-flags = [
  "-DBUILD_SHARED_LIBS=ON",
  "-DBUILD_STATIC_LIBS=ON",
  "-DC_LAPACK=ON",
  "-DDYNAMIC_ARCH=ON",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
]
run = [
  "musl",
]

[check]
enabled = true
skip = []
