version = "4.1.0"

[source]
url = "https://github.com/openssl/openssl/releases/download/openssl-4.1.0/openssl-4.1.0.tar.gz"
sha256 = "50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd"

[build]
kind = "autotools"
configure-command = [
  "./Configure",
  "--prefix={out}",
  "--openssldir=/etc/ssl",
  "--libdir=lib",
  "shared",
  "linux-x86_64",
  "no-tests",
]
install-targets = [
  "install_sw",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "coreutils",
  "linux-headers",
  "make",
  "perl",
]
run = [
  "musl",
  "zlib",
]

[check]
enabled = false
skip = []
