version = "8.23.0"

[source]
url = "https://github.com/curl/curl/releases/download/curl-8_23_0/curl-8.23.0.tar.xz"
sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"

[build]
kind = "autotools"
configure-flags = [
  "--with-openssl",
  "--with-zlib",
  "--with-zstd",
  "--without-libpsl",
  "--without-brotli",
  "--without-nghttp2",
  "--without-libidn2",
  "--disable-ldap",
  "--without-ca-bundle",
  "--without-ca-path",
]

[dependencies]
build = [
  "binutils",
  "linux-headers",
  "make",
  "pkgconf",
]
run = [
  "libressl",
  "musl",
  "zlib",
  "zstd",
]

[check]
enabled = false
skip = []
