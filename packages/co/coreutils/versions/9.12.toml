version = "9.12"

[source]
url = "https://ftp.gnu.org/gnu/coreutils/coreutils-9.12.tar.xz"
sha256 = "a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210"

[build]
kind = "autotools"
configure-flags = [
  "--disable-nls",
  "--without-selinux",
  "--without-openssl",
  "--without-libgmp",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
