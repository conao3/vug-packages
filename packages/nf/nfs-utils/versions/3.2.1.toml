version = "3.2.1"
patches = [
  "3.2.1-nfsdctl-includes.patch",
  "3.2.1-rpcent-compat.patch",
  "3.2.1-rpcgen-cpp-x-c.patch",
  "3.2.1-statd-getservbyport.patch",
  "3.2.1-sys-queue.patch",
]

[source]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/nfs-utils/3.2.1/nfs-utils-3.2.1.tar.xz"
sha256 = "a54163d8dd589fc87048c6029011bda101a580c27770a377558be2422a976afb"

[build]
kind = "autotools"
configure-flags = [
  "CPPFLAGS=-D_LARGEFILE64_SOURCE -I{dep:libbsd}/include",
  "ac_cv_func_getrpcbyname=yes",
  "ac_cv_func_getrpcbynumber=yes",
  "--with-rpcgen=internal",
  "--with-systemd",
  "--with-krb5={dep:krb5}",
]

[dependencies]
build = [
  "binutils",
  "libbsd",
  "make",
  "pkgconf",
]
run = [
  "bash",
  "cyrus-sasl",
  "keyutils",
  "krb5",
  "libcap",
  "libevent",
  "libnl",
  "libtirpc",
  "libxml2",
  "musl",
  "openldap",
  "readline",
  "sqlite",
  "util-linux",
]

[check]
enabled = true
skip = []
