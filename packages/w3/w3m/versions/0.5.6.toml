version = "0.5.6"

[source]
url = "https://git.sr.ht/~rkta/w3m/archive/v0.5.6.tar.gz"
sha256 = "8dd652cd3f31817d68c7263c34eeffb50118c80be19e1159bf8cbf763037095e"

[build]
kind = "autotools"
configure-flags = [
  "--enable-image=no",
]

[dependencies]
build = [
  "binutils",
  "make",
  "man-db",
  "perl",
]
run = [
  "boehm-gc",
  "gettext",
  "gpm",
  "musl",
  "ncurses",
  "openssl",
  "zlib",
]

[check]
enabled = false
skip = []
