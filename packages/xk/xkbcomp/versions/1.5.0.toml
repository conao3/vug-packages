version = "1.5.0"

[source]
url = "https://www.x.org/releases/individual/app/xkbcomp-1.5.0.tar.xz"
sha256 = "2ac31f26600776db6d9cd79b3fcd272263faebac7eb85fb2f33c7141b8486060"

[build]
kind = "autotools"
configure-flags = [
  "--with-xkb-config-root={dep:xkeyboard-config}/share/X11/xkb",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
  "xorgproto",
]
run = [
  "libx11",
  "libxkbfile",
  "musl",
  "xkeyboard-config",
]

[check]
enabled = true
skip = []
