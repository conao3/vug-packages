version = "33"

[source]
url = "https://cdn.kernel.org/pub/linux/utils/kernel/kmod/kmod-33.tar.xz"
sha256 = "dc768b3155172091f56dc69430b5481f2d76ecd9ccb54ead8c2540dbcf5ea9bc"

[build]
kind = "autotools"
configure-flags = [
  "--with-zlib",
  "--with-xz",
  "--without-zstd",
  "--without-openssl",
  "--disable-manpages",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "musl",
  "xz",
  "zlib",
]

[check]
enabled = false
skip = []
