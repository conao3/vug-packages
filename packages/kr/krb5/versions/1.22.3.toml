version = "1.22.3"

[source]
url = "https://kerberos.org/dist/krb5/1.22/krb5-1.22.3.tar.gz"
sha256 = "fe90af8441ad9fa9b064b8e53077cefb782a96f8a68276b031dc54af1789ff0b"

[build]
kind = "autotools"
configure-command = [
  "src/configure",
  "--prefix={out}",
]
configure-flags = [
  "--with-tls-impl=no",
]

[dependencies]
build = [
  "binutils",
  "bison",
  "make",
  "perl",
  "pkgconf",
]
run = [
  "keyutils",
  "libedit",
  "musl",
  "openssl",
]

[check]
enabled = false
skip = []
