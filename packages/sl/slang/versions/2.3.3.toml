version = "2.3.3"

[source]
url = "https://www.jedsoft.org/releases/slang/slang-2.3.3.tar.bz2"
sha256 = "f9145054ae131973c61208ea82486d5dd10e3c5cdad23b7c4a0617743c8f5a18"

[build]
kind = "autotools"
configure-flags = [
  "LDFLAGS=-Wl,--undefined-version",
  "ac_cv_path_nc5config=/bin/dirname",
  "RPATH=-Wl,-rpath,",
  "--without-onig",
  "--without-pcre",
  "--without-png",
  "--without-z",
]

[dependencies]
build = [
  "make",
]
run = [
  "musl",
]

[check]
enabled = true
skip = []
