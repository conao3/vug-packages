version = "1.3.15"

[source]
url = "https://github.com/silnrsi/graphite/releases/download/1.3.15/graphite2-1.3.15.tgz"
sha256 = "c6bc8b4252724665297f7cad0c55897285c673f9b8e6db3522ace833593fe0b1"

[build]
kind = "cmake"

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
  "python",
]
run = [
  "libcxx",
  "musl",
]

[check]
enabled = true
skip = [
  "annacmp1",
  "awamicmp1",
  "chariscmp1",
  "chariscmp2",
  "padaukcmp1",
  "schercmp1",
]
