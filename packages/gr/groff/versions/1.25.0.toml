version = "1.25.0"

[source]
url = "https://ftp.gnu.org/gnu/groff/groff-1.25.0.tar.gz"
sha256 = "24d103a07eb79e418963bce206c8771b649871f83bda2fd4c2e65529c1c56921"

[build]
kind = "autotools"
configure-flags = [
  "--without-x",
  "--with-doc=no",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "bison",
  "coreutils",
  "diffutils",
  "gawk",
  "grep",
  "m4",
  "make",
  "perl",
  "sed",
  "texinfo",
]
run = [
  "musl",
  "perl",
]

[check]
enabled = false
skip = []
