version = "2.4.1"

[source]
url = "https://www.surina.net/soundtouch/soundtouch-2.4.1.tar.gz"
sha256 = "e07abf20ce8f95850c280132e1f61ad400fc1f4011b7fac698a503de6aab6733"

[build]
kind = "autotools"
autoreconf = true
configure-flags = [
  "LDFLAGS=-rtlib=compiler-rt",
]

[dependencies]
build = [
  "autoconf",
  "automake",
  "binutils",
  "libtool",
  "make",
]
run = [
  "libcxx",
  "musl",
]

[check]
enabled = true
skip = []
