version = "21.1.25"

[source]
url = "https://www.x.org/releases/individual/xserver/xorg-server-21.1.25.tar.xz"
sha256 = "6ad4e3c7b59a309b32c92e5c15ce1267110f9e13f1ac78da62361a628da1a0eb"

[build]
kind = "meson"
setup-flags = [
  "-Dlibunwind=true",
]

[dependencies]
build = [
  "binutils",
  "font-util",
  "linux-headers",
  "mesa:dev",
  "meson",
  "pkgconf",
  "python",
  "samurai",
  "xkbcomp",
  "xorgproto",
  "xtrans",
]
run = [
  "audit",
  "dbus",
  "libdrm",
  "libepoxy",
  "libglvnd",
  "libpciaccess",
  "libselinux",
  "libtirpc",
  "libunwind",
  "libx11",
  "libxau",
  "libxcvt",
  "libxdmcp",
  "libxext",
  "libxfont_2",
  "libxkbfile",
  "libxshmfence",
  "mesa",
  "musl",
  "openssl",
  "pixman",
  "systemd",
  "xkbcomp",
  "xkeyboard-config",
]

[check]
enabled = true
skip = []
