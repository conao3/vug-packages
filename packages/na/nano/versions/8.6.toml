version = "8.6"

[source]
url = "https://www.nano-editor.org/dist/v8/nano-8.6.tar.xz"
sha256 = "f7abfbf0eed5f573ab51bd77a458f32d82f9859c55e9689f819d96fe1437a619"

[build]
kind = "autotools"
configure-flags = [
  "--disable-nls",
  "--disable-libmagic",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "musl",
  "ncurses",
]

[check]
enabled = true
skip = []
