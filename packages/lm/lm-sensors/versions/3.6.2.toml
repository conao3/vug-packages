version = "3.6.2"

[source]
url = "https://github.com/hramrach/lm-sensors/archive/refs/tags/V3-6-2.tar.gz"
sha256 = "c6a0587e565778a40d88891928bf8943f27d353f382d5b745a997d635978a8f0"

[build]
