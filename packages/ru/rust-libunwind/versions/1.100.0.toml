version = "1.100.0"

[source]
url = "https://static.rust-lang.org/dist/2026-11-12/rust-std-1.100.0-x86_64-unknown-linux-musl.tar.xz"
sha256 = "9d5211bc7b40195f9700a6f9133831832a32f50d0e2a2c0ae8af801e7656de5c"

[build]
kind = "commands"
commands = [
  ["mkdir", "-p", "{out}/lib"],
  ["cc", "-shared", "-o", "{out}/lib/libgcc_s.so.1", "-Wl,-soname,libgcc_s.so.1", "-Wl,--whole-archive", "rust-std-x86_64-unknown-linux-musl/lib/rustlib/x86_64-unknown-linux-musl/lib/self-contained/libunwind.a", "-Wl,--no-whole-archive"],
]

[dependencies]
build = [
  "tar",
  "xz",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []

[links]
"lib/libgcc_s.so" = "libgcc_s.so.1"
