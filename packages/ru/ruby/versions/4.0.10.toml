version = "4.0.10"
patches = [
  "4.0.10-btest-once-recursive.patch",
]

[source]
url = "https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.10.tar.gz"
sha256 = "b53eef3371fa5d3e3b74340edcd015f06d5d8853968d4e539a5264fce41ed9f1"

[build]
kind = "autotools"
configure-flags = [
  "--disable-yjit",
  "--disable-zjit",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "gmp",
  "libffi",
  "libyaml",
  "musl",
  "ncurses",
  "openssl",
  "readline",
  "zlib",
]

[check]
enabled = true
skip = []
target = "test"
