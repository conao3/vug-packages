version = "4.10.0"

[source]
url = "https://ftp.gnu.org/gnu/findutils/findutils-4.10.0.tar.xz"
sha256 = "1387e0b67ff247d2abde998f90dfbf70c1491391a59ddfecb8ae698789f0a4f5"

[build]
kind = "autotools"
configure-flags = [
  "--disable-nls",
  "--without-selinux",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
]

[check]
enabled = true
skip = [
  "test-c32ispunct.sh",
  "tests/find/exec-plus-last-file.sh",
  "tests/xargs/test-sigusr",
]
