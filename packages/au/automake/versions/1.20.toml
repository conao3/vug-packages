version = "1.20"

[source]
url = "https://ftp.gnu.org/gnu/automake/automake-1.20.tar.xz"
sha256 = "f6f34dad4cbe395715762b0710f7c511e39bd5cf777e6b95818ccbecf7714248"

[build]
kind = "autotools"

[dependencies]
build = [
  "autoconf",
  "bash",
  "binutils",
  "coreutils",
  "diffutils",
  "findutils",
  "gawk",
  "grep",
  "m4",
  "make",
  "perl",
  "sed",
]
run = [
  "autoconf",
  "perl",
]

[check]
enabled = false
skip = []
