version = "8.3"

[source]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"

[build]
kind = "autotools"
configure-flags = [
  "--with-curses",
  "--with-shared-termcap-library",
]
make-flags = [
  "SHLIB_LIBS=-ltinfow",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
  "ncurses",
]

[check]
enabled = false
skip = []
