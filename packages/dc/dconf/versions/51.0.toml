version = "51.0"
patches = [
  "51.0-docbook-xsl-option.patch",
]

[source]
url = "https://download.gnome.org/sources/dconf/51/dconf-51.0.tar.xz"
sha256 = "e65c1b7867f836faad9f9ee04acf5c5a6cae2bbc784833fe093207e0cb590248"

[build]
kind = "meson"
setup-flags = [
  "-Ddocbook_xsl={dep:docbook-xsl-nons}/share/xml/xsl/docbook/manpages/docbook.xsl",
]

[dependencies]
build = [
  "bash",
  "bash-completion",
  "binutils",
  "dbus",
  "docbook-xsl-nons",
  "libxslt",
  "meson",
  "pkgconf",
  "python",
  "samurai",
  "vala",
]
run = [
  "glib",
  "musl",
]

[check]
enabled = true
skip = [
  "dconf",
  "gdbus-filter-leak",
  "gdbus-thread-leak",
]
