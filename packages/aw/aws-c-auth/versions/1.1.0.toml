version = "1.1.0"

[source]
url = "https://github.com/awslabs/aws-c-auth/archive/refs/tags/v1.1.0.tar.gz"
sha256 = "faa8ac8aff348d5e69e4598a0e9a48efe049cd4410cec2a5988dcf68f6a14fd2"

[build]
kind = "cmake"
setup-flags = [
  "-DENABLE_NET_TESTS=OFF",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
]
run = [
  "aws-c-cal",
  "aws-c-common",
  "aws-c-compression",
  "aws-c-http",
  "aws-c-io",
  "aws-c-sdkutils",
  "musl",
  "openssl",
  "s2n-tls",
]

[check]
enabled = true
skip = []
