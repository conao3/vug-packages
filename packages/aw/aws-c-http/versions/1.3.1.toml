version = "1.3.1"

[source]
url = "https://github.com/awslabs/aws-c-http/archive/refs/tags/v1.3.1.tar.gz"
sha256 = "40cd2009ec16712384d7bfd70251ff29d93863499f25cab0dd5507af1e0023c1"

[build]
kind = "cmake"
setup-flags = [
  "-DENABLE_NET_TESTS=OFF",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
]
run = [
  "aws-c-cal",
  "aws-c-common",
  "aws-c-compression",
  "aws-c-io",
  "musl",
  "openssl",
  "s2n-tls",
]

[check]
enabled = true
skip = []
