version = "3.4.1"

[source]
url = "https://download.samba.org/pub/rsync/src/rsync-3.4.1.tar.gz"
sha256 = "2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52"

[build]
kind = "autotools"
configure-flags = [
  "--disable-openssl",
  "--disable-xxhash",
  "--disable-lz4",
  "--disable-md2man",
  "--with-included-popt",
  "--without-included-zlib",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "make",
]
run = [
  "musl",
  "zlib",
  "zstd",
]

[check]
enabled = false
skip = []
