version = "412"

[source]
url = "https://invisible-island.net/archives/xterm/xterm-412.tgz"
sha256 = "b48bc780c1cbc14f6d89269f7e593712af6095876960d650be28b55e5dad65a6"

[build]
kind = "autotools"
configure-flags = [
  "--disable-luit",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
  "xorgproto",
]
run = [
  "fontconfig",
  "freetype",
  "libice",
  "libsm",
  "libx11",
  "libxaw",
  "libxcursor",
  "libxext",
  "libxft",
  "libxinerama",
  "libxpm",
  "libxt",
  "musl",
  "ncurses",
]

[check]
enabled = true
skip = []
