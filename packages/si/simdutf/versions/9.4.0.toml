version = "9.4.0"

[source]
url = "https://github.com/simdutf/simdutf/archive/refs/tags/v9.4.0.tar.gz"
sha256 = "361555059c963a1e5d78f3c7d42f35a19722b0333e6385994ff0fe7d80a5786a"

[build]
kind = "cmake"
setup-flags = [
  "-DBUILD_SHARED_LIBS=ON",
  "-DSIMDUTF_TESTS=OFF",
  "-DSIMDUTF_BENCHMARKS=OFF",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
]
run = [
  "libcxx",
  "musl",
]

[check]
enabled = true
skip = []
