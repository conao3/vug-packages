version = "2.0.16"
patches = [
  "2.0.16-libxml2-2.11.patch",
]

[source]
url = "https://download.librdf.org/source/raptor2-2.0.16.tar.gz"
sha256 = "089db78d7ac982354bdbf39d973baf09581e6904ac4c92a98c5caadb3de44680"

[build]
kind = "autotools"
configure-flags = [
  "--with-yajl=no",
]

[dependencies]
build = [
  "binutils",
  "make",
  "perl",
  "pkgconf",
]
run = [
  "curl",
  "libxml2",
  "libxslt",
  "musl",
]

[check]
enabled = true
skip = []
