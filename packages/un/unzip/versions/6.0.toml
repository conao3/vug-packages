version = "6.0"

[source]
url = "https://downloads.sourceforge.net/infozip/unzip60.tar.gz"
sha256 = "036d96991646d0449ed0aa952e4fbe21b476ce994abc276e49d30e686708bd37"

[build]
kind = "make"
make-flags = [
  "-f",
  "unix/Makefile",
  "prefix={out}",
  "CC=cc -std=gnu89",
]
build-targets = [
  "generic",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
]

[check]
enabled = true
skip = []
