version = "2026.4"
patches = [
  "2026.4-system-deps.patch",
]

[source]
url = "https://github.com/google/shaderc/archive/refs/tags/v2026.4.tar.gz"
sha256 = "f06ce5bcca94e5df7f34e115743597d0ad2e13c5fe9213c67dc8c76031241947"

[build]
kind = "cmake"
setup-flags = [
  "-DSHADERC_SKIP_TESTS=ON",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
  "python",
  "spirv-headers",
]
run = [
  "glslang",
  "libcxx",
  "musl",
  "spirv-tools",
]

[check]
enabled = false
skip = []
