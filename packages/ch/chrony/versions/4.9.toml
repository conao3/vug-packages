version = "4.9"

[source]
url = "https://chrony-project.org/releases/chrony-4.9.tar.gz"
sha256 = "4924c6f530105bcd5b9e9e33c48a2ae1bfd889222c8480bc41601110efc864d0"

[build]
kind = "autotools"
configure-flags = [
  "--sysconfdir=/etc",
  "--chronyvardir=/var/lib/chrony",
  "--without-nettle",
  "--without-gnutls",
  "--without-nss",
  "--without-tomcrypt",
  "--without-editline",
  "--without-seccomp",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "linux-headers",
  "make",
]
run = [
  "libcap",
  "musl",
]

[check]
enabled = false
skip = []
