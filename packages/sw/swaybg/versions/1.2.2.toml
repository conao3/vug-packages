version = "1.2.2"

[source]
url = "https://github.com/swaywm/swaybg/releases/download/v1.2.2/swaybg-1.2.2.tar.gz"
sha256 = "a6652a0060a0bea3c3318d9d03b6dddac34f6aeca01b883eef9e58281f5202a1"

[build]
kind = "meson"
setup-flags = [
  "-Dman-pages=disabled",
  "-Dgdk-pixbuf=disabled",
]

[dependencies]
build = [
  "binutils",
  "meson",
  "pkgconf",
  "python",
  "samurai",
  "wayland-protocols",
  "xorgproto",
]
run = [
  "cairo",
  "musl",
  "wayland",
]

[check]
enabled = true
skip = []
