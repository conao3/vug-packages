  "MULTIUSER=y",
  "PRINTK=y",
  "PRINTK_TIME=y",
  "EARLY_PRINTK=y",
  "TTY=y",
  "UNIX98_PTYS=y",
  "SERIAL_8250=y",
  "SERIAL_8250_CONSOLE=y",
  "BLK_DEV_INITRD=y",
  "RD_GZIP=y",
  "BINFMT_ELF=y",
  "BINFMT_SCRIPT=y",
  "DEVTMPFS=y",
  "DEVTMPFS_MOUNT=y",
  "PROC_FS=y",
  "PROC_SYSCTL=y",
  "SYSFS=y",
  "TMPFS=y",
  "TMPFS_POSIX_ACL=y",
  "TMPFS_XATTR=y",
  "SHMEM=y",
  "FUTEX=y",
  "EPOLL=y",
  "SIGNALFD=y",
  "TIMERFD=y",
  "EVENTFD=y",
  "AIO=y",
  "POSIX_TIMERS=y",
  "FILE_LOCKING=y",
  "INOTIFY_USER=y",
  "FHANDLE=y",
  "HIGH_RES_TIMERS=y",
  "NO_HZ_IDLE=y",
  "CGROUPS=y",
  "CGROUP_PIDS=y",
  "CGROUP_FREEZER=y",
  "CGROUP_SCHED=y",
  "MEMCG=y",
  "NAMESPACES=y",
  "UTS_NS=y",
