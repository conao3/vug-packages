  "UNIX=y",
  "INET=y",
  "IPV6=y",
  "PACKET=y",
  "NETDEVICES=y",
  "ETHERNET=y",
  "NET_VENDOR_INTEL=y",
  "E1000=y",
  "PCI=y",
  "ACPI=y",
  "BLOCK=y",
  "AUTOFS_FS=y",
  "SECCOMP=y",
  "KALLSYMS=y",
  "BUG=y",
  "ADVISE_SYSCALLS=y",
