[dependencies]
build = [
  "bash",
  "binutils",
  "bison",
  "coreutils",
  "elfutils",
  "flex",
  "m4",
  "make",
  "musl",
  "sed",
  "zlib",
]
run = []

[check]
enabled = false
skip = []
