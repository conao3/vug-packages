version = "1.0.0"
patches = [
  "1.0.0-drop-exclude-libs.patch",
]

[source]
url = "https://github.com/lief-project/LIEF/archive/refs/tags/1.0.0.tar.gz"
sha256 = "2cf412695ff739d82e129db441e5c2025f3bb4873a3d3a1d3dd4cf300b682abd"

[build]
kind = "cmake"
setup-flags = [
  "-DBUILD_SHARED_LIBS=ON",
  "-DLIEF_EXAMPLES=OFF",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
]
run = [
  "libcxx",
  "musl",
]

[check]
enabled = false
skip = []
