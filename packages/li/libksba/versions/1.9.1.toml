version = "1.9.1"

[source]
url = "https://gnupg.org/ftp/gcrypt/libksba/libksba-1.9.1.tar.bz2"
sha256 = "9afdd398b4a076735e1e7fd29c7f6e7670b6c382aee2d3a55aa937b283f43e5b"

[build]
kind = "autotools"
configure-flags = [
  "--with-libgpg-error-prefix={dep:libgpg-error}",
]

[dependencies]
build = [
  "binutils",
  "make",
]
