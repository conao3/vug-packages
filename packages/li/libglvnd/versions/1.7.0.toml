version = "1.7.0"

[source]
url = "https://gitlab.freedesktop.org/glvnd/libglvnd/-/archive/v1.7.0/libglvnd-v1.7.0.tar.gz"
sha256 = "2b6e15b06aafb4c0b6e2348124808cbd9b291c647299eaaba2e3202f51ff2f3d"

[build]
kind = "meson"

[dependencies]
build = [
  "binutils",
  "meson",
  "pkgconf",
  "python",
  "samurai",
  "xorgproto",
]
run = [
  "libx11",
  "libxext",
  "musl",
]

[check]
enabled = true
skip = [
  "glxcreatecontext",
  "glxgetclientstr",
  "glxgetprocaddress_genentry",
  "glxgetprocess",
  "glxgetprocess_genentry",
  "glxgetqueryversion",
  "glxmakecurrent (basic)",
  "glxmakecurrent (loop)",
  "glxmakecurrent (oldlink)",
  "glxmakecurrent_mt",
]
