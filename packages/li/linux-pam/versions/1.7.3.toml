version = "1.7.3"

[source]
url = "https://github.com/linux-pam/linux-pam/releases/download/v1.7.3/Linux-PAM-1.7.3.tar.xz"
sha256 = "2ce4765fd49df6693771ef2941f81e33d8ee14b94a81a5c7b369aa3b137b85a5"

[build]
kind = "meson"
setup-flags = [
  "-Dsysconfdir=/etc",
  "-Ddocs=disabled",
  "-Daudit=disabled",
  "-Dselinux=disabled",
  "-Dnis=disabled",
  "-Deconf=disabled",
  "-Dlogind=disabled",
  "-Delogind=disabled",
  "-Dopenssl=disabled",
  "-Di18n=disabled",
  "-Dpwaccess=disabled",
  "-Dexamples=false",
  "-Dxtests=false",
  "-Dpam_userdb=disabled",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "bison",
  "coreutils",
  "flex",
  "linux-headers",
  "meson",
  "pkgconf",
  "python",
  "samurai",
  "sed",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
