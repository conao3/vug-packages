version = "1.5.4"

[source]
url = "https://www.x.org/releases/individual/lib/libXfont-1.5.4.tar.bz2"
sha256 = "1a7f7490774c87f2052d146d1e0e64518d32e6848184a18654e8d0bb57883242"

[build]
kind = "autotools"
configure-flags = [
  "--without-xmlto",
  "--without-fop",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
  "xorgproto",
  "xtrans",
]
run = [
  "freetype",
  "libfontenc",
  "musl",
  "zlib",
]
expose = [
  "xorgproto",
]

[check]
enabled = true
skip = []
