version = "0.14"

[source]
url = "https://0pointer.de/lennart/projects/libdaemon/libdaemon-0.14.tar.gz"
sha256 = "fd23eb5f6f986dcc7e708307355ba3289abe03cc381fc47a80bca4a50aa6b834"

[build]
kind = "autotools"
autoreconf = true
configure-flags = [
  "--disable-examples",
  "--localstatedir=/var",
]

[dependencies]
build = [
  "autoconf",
  "automake",
  "binutils",
  "grep",
  "libtool",
  "m4",
  "make",
  "perl",
  "pkgconf",
  "sed",
]
run = [
  "musl",
]

[check]
enabled = true
skip = []
