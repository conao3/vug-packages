version = "1.3.1"

[source]
url = "https://www.x.org/releases/individual/lib/libXmu-1.3.1.tar.xz"
sha256 = "81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4"

[build]
kind = "autotools"
configure-flags = [
  "--disable-docs",
  "--without-xmlto",
  "--without-fop",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
  "xorgproto",
]
run = [
  "libx11",
  "libxext",
  "libxt",
  "musl",
]
expose = [
  "xorgproto",
]

[check]
enabled = true
skip = []
