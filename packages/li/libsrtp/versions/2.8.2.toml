version = "2.8.2"
patches = [
  "2.8.2-link-test-apps-against-archive.patch",
]

[source]
url = "https://github.com/cisco/libsrtp/archive/refs/tags/v2.8.2.tar.gz"
sha256 = "02e8326e12381e27a205ded888a803c6ff55ec7be170cd5e5506251f731fee92"

[build]
kind = "autotools"
configure-flags = [
  "--enable-openssl",
]
make-flags = [
  "all",
  "shared_library",
]

[dependencies]
build = [
  "binutils",
  "libpcap",
  "make",
  "pkgconf",
]
run = [
  "musl",
  "openssl",
]

[check]
enabled = true
skip = []
target = "runtest"
