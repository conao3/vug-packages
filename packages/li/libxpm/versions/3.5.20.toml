version = "3.5.20"

[source]
url = "https://www.x.org/releases/individual/lib/libXpm-3.5.20.tar.xz"
sha256 = "c064ead03e4dde78afdeb121fe0b644d25c550444cf903fbdc537f1a78f3ef74"

[build]
kind = "autotools"
configure-flags = [
  "LIBS=-lintl",
]

[dependencies]
build = [
  "binutils",
  "gettext",
  "gzip",
  "make",
  "ncompress",
  "pkgconf",
  "xorgproto",
]
run = [
  "gettext",
  "gzip",
  "libx11",
  "libxext",
  "libxt",
  "musl",
  "ncompress",
]

[check]
enabled = true
skip = []
