version = "1.0.16"

[source]
url = "https://www.x.org/releases/individual/lib/libXaw-1.0.16.tar.xz"
sha256 = "731d572b54c708f81e197a6afa8016918e2e06dfd3025e066ca642a5b8c39c8f"

[build]
kind = "autotools"
configure-flags = [
  "--disable-specs",
  "--without-xmlto",
  "--without-fop",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
  "xorgproto",
]
run = [
  "libx11",
  "libxext",
  "libxmu",
  "libxpm",
  "libxt",
  "musl",
]
expose = [
  "xorgproto",
]

[check]
enabled = true
skip = []
