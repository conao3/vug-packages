version = "1.2.0"

[source]
url = "https://www.kernel.org/pub/linux/libs/ieee1394/libiec61883-1.2.0.tar.xz"
sha256 = "d1e02c7e276fac37313a2f8c1c33d7a9e19282ff16f32e72435428ff5121f09e"

[build]
kind = "autotools"
configure-command = [
  "sh",
  "-c",
  "cp {dep:automake}/share/automake-1.20/config.sub config.sub && cp {dep:automake}/share/automake-1.20/config.guess config.guess && ./configure --prefix={out}",
]

[dependencies]
build = [
  "automake",
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "libraw1394",
  "musl",
]

[check]
enabled = true
skip = []
