version = "1.9.7"

[source]
url = "https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.7.tar.gz"
sha256 = "1a4fbe7589e814777ae76b64734ad80f4ecad22cd33a22682a2aaea4ae5375e7"

[build]
kind = "cmake"
setup-flags = [
  "-DBUILD_TESTS=OFF",
  "-DBUILD_CLI=ON",
  "-DUSE_SSH=libssh2",
  "-DUSE_HTTPS=OpenSSL",
  "-DREGEX_BACKEND=pcre2",
  "-DUSE_BUNDLED_ZLIB=OFF",
]

[dependencies]
build = [
  "binutils",
  "cmake",
  "make",
  "pkgconf",
  "python",
]
run = [
  "libressl",
  "libssh2",
  "musl",
  "pcre2",
  "zlib",
]

[check]
enabled = true
skip = []
