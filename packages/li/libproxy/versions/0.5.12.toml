version = "0.5.12"

[source]
url = "https://github.com/libproxy/libproxy/archive/refs/tags/0.5.12.tar.gz"
sha256 = "a1fa55991998b80a567450a9e84382421a7176a84446c95caaa8b72cf09fa86f"

[build]
kind = "meson"
setup-flags = [
  "-Ddocs=false",
  "-Drelease=true",
  "-Dconfig-gnome=true",
  "-Dpacrunner-duktape=true",
  "-Dvapi=false",
  "-Dintrospection=false",
]

[dependencies]
build = [
  "binutils",
  "meson",
  "pkgconf",
  "python",
  "samurai",
]
run = [
  "curl",
  "duktape",
  "glib",
  "gsettings-desktop-schemas",
  "musl",
]

[check]
enabled = true
skip = [
  "Config GNOME test",
]
