version = "1.1.45"

[source]
url = "https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.45.tar.xz"
sha256 = "9acfe68419c4d06a45c550321b3212762d92f41465062ca4ea19e632ee5d216e"

[build]
kind = "autotools"
configure-flags = [
  "--without-python",
  "--with-crypto",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "libgcrypt",
  "libgpg-error",
  "libxml2",
  "musl",
]

[check]
enabled = true
skip = []
