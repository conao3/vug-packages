version = "15.2.0-r5"

[source]
url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/main/x86_64/libstdc%2B%2B-15.2.0-r5.apk"
sha256 = "14c987b556f5385a5db18376e788c75f37d85321b8dc1920d926ea7daac1d6f6"

[build]
kind = "commands"
commands = [
  ["sh", "-ec", "set -o pipefail; gzip -dc *.apk | tar -ixf -; mkdir -p {out}/lib; cp -L usr/lib/libstdc++.so.6 {out}/lib/"],
]

[dependencies]
build = [
  "tar",
]
run = [
  "libgcc",
  "musl",
]

[check]
enabled = false
skip = []
