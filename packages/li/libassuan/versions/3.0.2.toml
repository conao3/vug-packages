version = "3.0.2"

[source]
url = "https://gnupg.org/ftp/gcrypt/libassuan/libassuan-3.0.2.tar.bz2"
sha256 = "d2931cdad266e633510f9970e1a2f346055e351bb19f9b78912475b8074c36f6"

[build]
kind = "autotools"
configure-flags = [
  "--disable-doc",
  "--with-libgpg-error-prefix={dep:libgpg-error}",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "libgpg-error",
  "musl",
]

[check]
enabled = false
skip = []
