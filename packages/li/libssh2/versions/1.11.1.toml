version = "1.11.1"

[source]
url = "https://libssh2.org/download/libssh2-1.11.1.tar.xz"
sha256 = "9954cb54c4f548198a7cbebad248bdc87dd64bd26185708a294b2b50771e3769"

[build]
kind = "autotools"
configure-flags = [
  "--with-crypto=openssl",
  "--with-libssl-prefix={dep:libressl}",
  "--disable-examples-build",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "libressl",
  "musl",
  "zlib",
]

[check]
enabled = false
skip = []
