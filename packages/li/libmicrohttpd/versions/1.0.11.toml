version = "1.0.11"

[source]
url = "https://ftp.gnu.org/gnu/libmicrohttpd/libmicrohttpd-1.0.11.tar.gz"
sha256 = "f227a044b75688e449b58ddedf0582255cc562899ff69f173a8ef76439744b4e"

[build]
kind = "autotools"
configure-flags = [
  "--disable-doc",
  "--disable-examples",
  "--without-gnutls",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
