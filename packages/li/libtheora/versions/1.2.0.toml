version = "1.2.0"

[source]
url = "https://downloads.xiph.org/releases/theora/libtheora-1.2.0.tar.xz"
sha256 = "ebdf77a8f5c0a8f7a9e42323844fa09502b34eb1d1fece7b5f54da41fe2122ec"

[build]
kind = "autotools"
configure-flags = [
  "--disable-doc",
  "--disable-spec",
  "--disable-examples",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "libogg",
  "musl",
]
expose = [
  "libogg",
]

[check]
enabled = true
skip = []
