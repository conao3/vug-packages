version = "0.5.4"
patches = [
  "0.5.4-automake-config-header.patch",
  "0.5.4-remove-panelctl.patch",
]

[source]
url = "https://downloads.sourceforge.net/project/libavc1394/libavc1394/libavc1394-0.5.4.tar.gz"
sha256 = "7cb1ff09506ae911ca9860bef4af08c2403f3e131f6c913a2cbd6ddca4215b53"

[build]
kind = "autotools"
autoreconf = true
configure-command = [
  "sh",
  "-c",
  "cp {dep:automake}/share/automake-1.20/config.sub config.sub && cp {dep:automake}/share/automake-1.20/config.guess config.guess && ./configure --prefix={out}",
]

[dependencies]
build = [
  "autoconf",
  "automake",
  "binutils",
  "libtool",
  "make",
  "pkgconf",
]
run = [
  "libraw1394",
  "musl",
]

[check]
enabled = true
skip = []
