version = "1.8.14"

[source]
url = "https://www.x.org/releases/individual/lib/libX11-1.8.14.tar.xz"
sha256 = "bbc78c46217174655c2b32b138ad119f3ac15f50808b4d0b3a2677a4b1afc950"

[build]
kind = "autotools"
configure-flags = [
  "--disable-specs",
  "--without-xmlto",
  "--without-fop",
  "ac_cv_path_RAWCPP=gcc -std=gnu23 -E -",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "coreutils",
  "make",
  "pkgconf",
  "sed",
  "xorgproto",
  "xtrans",
]
run = [
  "libxcb",
  "musl",
  "xorgproto",
]

[check]
enabled = false
skip = []
