version = "2.15.4"

[source]
url = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"
sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821"

[build]
kind = "autotools"
configure-flags = [
  "--without-python",
  "--with-zlib",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "musl",
  "zlib",
]

[check]
enabled = false
skip = []
