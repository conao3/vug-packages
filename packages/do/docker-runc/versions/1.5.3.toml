version = "1.5.3"

[source]
url = "https://github.com/opencontainers/runc/releases/download/v1.5.3/runc-1.5.3.tar.xz"
sha256 = "b46692550bfd6a6d69e15068d153446dfd401810809eecb767481fba90561b59"

[build]
kind = "commands"
commands = [
  ["mkdir", "-p", "{out}/bin"],
  ["sh", "-ec", "export CGO_ENABLED=1 GOCACHE=\"$PWD/.gocache\" GOPATH=\"$PWD/.gopath\"; go build -trimpath -tags 'seccomp urfave_cli_no_docs netgo osusergo' -ldflags '-linkmode external -extldflags -static -X main.version=1.5.3' -o {out}/bin/runc ."],
]

[dependencies]
build = [
  "go",
  "libseccomp",
  "pkgconf",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
