version = "5.44.0"

[source]
url = "https://www.cpan.org/src/5.0/perl-5.44.0.tar.xz"
sha256 = "505cf43912e9480495c344c70260452e32aa2a73c546a026b3f100053b23ce91"

[build]
kind = "autotools"
configure-command = [
  "./Configure",
  "-des",
  "-Dprefix={out}",
  "-Dcc=cc",
  "-Dusethreads",
  "-Duseshrplib",
  "-Dman1dir=none",
  "-Dman3dir=none",
  "-Dlibpth={dep:musl}/lib",
  "-Dmyhostname=vug",
  "-Dcf_email=root@vug",
  "-Dperladmin=root@vug",
  "-Dosvers=6.18",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "coreutils",
  "diffutils",
  "findutils",
  "gawk",
  "grep",
  "make",
  "sed",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
