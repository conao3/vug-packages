version = "2.005005"

[source]
url = "https://cpan.metacpan.org/authors/id/H/HA/HAARG/Moo-2.005005.tar.gz"
sha256 = "fb5a2952649faed07373f220b78004a9c6aba387739133740c1770e9b1f4b108"

[build]
kind = "perl"
driver = "make-maker"
modules = [
  "Method::Generate::Accessor",
  "Method::Generate::BuildAll",
  "Method::Generate::Constructor",
  "Method::Generate::DemolishAll",
  "Moo",
  "Moo::HandleMoose::FakeMetaClass",
  "Moo::HandleMoose::_TypeMap",
  "Moo::Object",
  "Moo::Role",
  "Moo::_Utils",
  "Moo::sification",
  "oo",
]

[dependencies]
build = [
  "make",
]
run = [
  "perl",
  "perl-class-method-modifiers",
  "perl-role-tiny",
  "perl-sub-quote",
]

[check]
enabled = true
skip = []
