version = "6.83"

[source]
url = "https://cpan.metacpan.org/authors/id/O/OA/OALDERS/libwww-perl-6.83.tar.gz"
sha256 = "e75f0fa9d3c6f0daf5a5a72fa9f8b1c9c0d23e3a84a8522ccb4f835232b95505"

[build]
kind = "perl"
driver = "make-maker"
modules = [
  "LWP",
  "LWP::RobotUA",
  "LWP::Simple",
  "LWP::UserAgent",
]

[dependencies]
build = [
  "make",
  "perl-encode-locale",
  "perl-file-listing",
  "perl-html-parser",
  "perl-http-cookiejar",
  "perl-http-cookies",
  "perl-http-daemon",
  "perl-http-date",
  "perl-http-message",
  "perl-http-negotiate",
  "perl-lwp-mediatypes",
  "perl-net-http",
  "perl-test-fatal",
  "perl-test-needs",
  "perl-test-requiresinternet",
  "perl-try-tiny",
  "perl-uri",
  "perl-www-robotrules",
]
run = [
  "perl",
  "perl-encode-locale",
  "perl-file-listing",
  "perl-html-parser",
  "perl-http-cookies",
  "perl-http-date",
  "perl-http-message",
  "perl-http-negotiate",
  "perl-lwp-mediatypes",
  "perl-net-http",
  "perl-try-tiny",
  "perl-uri",
  "perl-www-robotrules",
]

[check]
enabled = true
skip = []
