version = "2.59"

[source]
url = "https://cpan.metacpan.org/authors/id/T/TO/TODDR/XML-Parser-2.59.tar.gz"
sha256 = "a358fd7c49f5e27717a644a9102bd21dc7fc25a415983279c59b1580e2b62a58"

[build]
kind = "perl"
driver = "make-maker"
modules = [
  "XML::Parser",
  "XML::Parser::Expat",
  "XML::Parser::Style::Debug",
  "XML::Parser::Style::Objects",
  "XML::Parser::Style::Stream",
  "XML::Parser::Style::Subs",
  "XML::Parser::Style::Tree",
]

[dependencies]
build = [
  "make",
  "perl-file-sharedir-install",
]
run = [
  "expat",
  "musl",
  "perl",
  "perl-file-sharedir",
  "perl-libwww-perl",
]

[check]
enabled = true
skip = []
