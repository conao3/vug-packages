version = "2.2100"

[source]
url = "https://cpan.metacpan.org/authors/id/E/EH/EHUELS/Authen-SASL-2.2100.tar.gz"
sha256 = "4f0f100aeed34b52977a94b7df973e7f0b8f92d167b09f2b249bab81e8590e57"

[build]
