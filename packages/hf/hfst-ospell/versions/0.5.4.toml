version = "0.5.4"

[source]
url = "https://github.com/hfst/hfst-ospell/releases/download/v0.5.4/hfst-ospell-0.5.4.tar.bz2"
sha256 = "ab644c802f813a06a406656c3a873d31f6a999e13cafc9df68b03e76714eae0e"

[build]
kind = "autotools"
autoreconf = true
configure-flags = [
  "--without-libxmlpp",
]

[dependencies]
build = [
  "autoconf",
  "automake",
  "binutils",
  "libtool",
  "make",
  "pkgconf",
]
run = [
  "icu4c",
  "libarchive",
  "libcxx",
  "musl",
]

[check]
enabled = true
skip = []
