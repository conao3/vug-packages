version = "1.6.6"

[source]
url = "https://download.gnome.org/sources/gssdp/1.6/gssdp-1.6.6.tar.xz"
sha256 = "767d2275254ce0efeaeac64419ff9f4f0ad470d134ef672f5c556b2abb786bcb"

[build]
kind = "meson"
setup-flags = [
  "-Dsniffer=false",
  "-Dintrospection=false",
  "-Dvapi=false",
  "-Dexamples=false",
  "-Dmanpages=false",
]

[dependencies]
build = [
  "binutils",
  "meson",
  "pkgconf",
  "python",
  "samurai",
]
run = [
  "glib",
  "libsoup",
  "musl",
]

[check]
enabled = true
skip = []
