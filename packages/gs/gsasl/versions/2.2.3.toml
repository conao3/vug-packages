version = "2.2.3"

[source]
url = "https://ftp.gnu.org/gnu/gsasl/gsasl-2.2.3.tar.gz"
sha256 = "fee36c66ac12d32d3bf29a7b35ad8f444b7996fe369b9da5d36fd6ae649c68eb"

[build]
kind = "autotools"
configure-flags = [
  "--disable-ntlm",
  "--with-gssapi-impl=mit",
]

[dependencies]
build = [
  "binutils",
  "gettext",
  "make",
]
run = [
  "gettext",
  "krb5",
  "libidn",
  "musl",
]

[check]
enabled = true
skip = []
