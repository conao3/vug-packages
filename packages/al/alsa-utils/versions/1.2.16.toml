version = "1.2.16"

[source]
url = "https://www.alsa-project.org/files/pub/utils/alsa-utils-1.2.16.tar.bz2"
sha256 = "092399d5e8749a1d5e188e393157521cec4b75693b60ebb79bbce728cff2232c"

[build]
kind = "autotools"
configure-flags = [
  "--disable-alsaconf",
  "--disable-alsaloop",
  "--disable-bat",
  "--disable-nhlt",
  "--disable-rst2man",
  "--disable-xmlto",
  "--with-curses=ncursesw",
  "--with-systemdsystemunitdir=no",
]

[dependencies]
build = [
  "binutils",
  "linux-headers",
  "make",
  "pkgconf",
]
run = [
  "alsa-lib",
  "musl",
  "ncurses",
]

[check]
enabled = false
skip = []
