version = "1.1"
patches = [
  "1.1-install-target.patch",
  "1.1-pkgconf-name.patch",
]

[source]
url = "https://git.kernel.org/pub/scm/linux/kernel/git/colyli/bcache-tools.git/snapshot/bcache-tools-1.1.tar.gz"
sha256 = "d1c92274ae03b414dd1a05277bf89dd2a8395496c692e3b143d9e6112d3421f8"

[build]
kind = "make"
make-flags = [
  "PREFIX={out}",
  "UDEVLIBDIR={out}/lib/udev",
  "DRACUTLIBDIR={out}/lib/dracut",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "musl",
  "util-linux",
]

[check]
enabled = false
skip = []
