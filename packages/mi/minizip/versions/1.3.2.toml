version = "1.3.2"

[source]
url = "https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz"
sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"

[build]
kind = "autotools"
configure-command = [
  "sh",
  "-c",
  "cd contrib/minizip && autoreconf -fi && ./configure --prefix={out} --enable-demos",
]
make-flags = [
  "-C",
  "contrib/minizip",
]

[dependencies]
build = [
  "autoconf",
  "automake",
  "binutils",
  "libtool",
  "make",
]
run = [
  "musl",
  "zlib",
]

[check]
enabled = true
skip = []
