version = "2.8.21"

[source]
url = "https://github.com/rrthomas/enchant/releases/download/v2.8.21/enchant-2.8.21.tar.gz"
sha256 = "dd2a762697c463148a8f59867089a5ebf2dd1449d869f93764b76c12bcf8acc0"

[build]
kind = "autotools"
configure-flags = [
  "--without-hspell",
]

[dependencies]
build = [
  "binutils",
  "groff",
  "make",
  "pkgconf",
]
run = [
  "aspell",
  "glib",
  "hunspell",
  "libcxx",
  "libvoikko",
  "musl",
  "nuspell",
]

[check]
enabled = false
skip = []
