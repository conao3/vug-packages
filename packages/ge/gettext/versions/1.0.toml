version = "1.0"

[source]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.gz"
sha256 = "85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a"

[build]
kind = "autotools"
configure-flags = [
  "--disable-java",
  "--disable-csharp",
  "--without-emacs",
  "--without-included-libunistring",
  "--without-included-libxml",
  "--with-included-libintl",
  "--disable-libasprintf",
]

[dependencies]
build = [
  "binutils",
  "make",
  "pkgconf",
]
run = [
  "libcxx",
  "libunistring",
  "libxml2",
  "musl",
  "ncurses",
]

[check]
enabled = false
skip = []
