  "dbus/bug735437.test",
  "dbus/bug782719.test",
  "dbus/bug783002.test",
  "dbus/connection.test",
  "dbus/dicts.test",
  "dbus/dynamic-method.test",
  "dbus/errors.test",
  "dbus/filedescriptor-async.test",
  "dbus/filedescriptor-errors.test",
  "dbus/filedescriptor.test",
  "dbus/generics.test",
  "dbus/interface-info.test",
  "dbus/no-reply.test",
