version = "0.56.19"
patches = [
  "0.56.19-skip-girwriter-vapigen.patch",
]

[source]
url = "https://download.gnome.org/sources/vala/0.56/vala-0.56.19.tar.xz"
sha256 = "5ad7cbbfcc0de61b403d6797c9ef60455bfbebd8e162aec33b5b0b097adfb9d5"

[build]
kind = "autotools"
configure-flags = [
  "--disable-valadoc",
  "ac_cv_path_G_IR_COMPILER=:",
]

[dependencies]
build = [
  "bash",
  "binutils",
  "bison",
  "dbus",
  "flex",
  "gobject-introspection",
  "make",
  "pkgconf",
]
run = [
  "glib",
  "musl",
]

[check]
enabled = true
skip = [
  "dbus/arrays.test",
  "dbus/async-bus.test",
  "dbus/async-connection.test",
  "dbus/async-errors.test",
  "dbus/async-no-reply.test",
  "dbus/async.test",
  "dbus/basic-types.test",
