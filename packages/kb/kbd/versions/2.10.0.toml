version = "2.10.0"

[source]
url = "https://cdn.kernel.org/pub/linux/utils/kbd/kbd-2.10.0.tar.xz"
sha256 = "6e5ca4f8d76ee9e3a8db700b667f13e12aac9933828a64e1aaad93d26be9b479"

[build]
kind = "autotools"
configure-flags = [
  "--disable-vlock",
  "--disable-nls",
  "--disable-tests",
]

[dependencies]
build = [
  "binutils",
  "bison",
  "coreutils",
  "flex",
  "linux-headers",
  "make",
  "pkgconf",
]
run = [
  "musl",
  "zlib",
]

[check]
enabled = true
skip = []
