version = "6.6"

[source]
url = "https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz"
sha256 = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"

[build]
kind = "autotools"
configure-flags = [
  "--with-shared",
  "--without-debug",
  "--without-ada",
  "--enable-widec",
  "--enable-overwrite",
  "--enable-pc-files",
  "--with-pkg-config-libdir={out}/lib/pkgconfig",
  "--with-termlib",
  "--disable-stripping",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []

[links]
"lib/libcurses.so" = "libncursesw.so"
"lib/libform.so" = "libformw.so"
"lib/libmenu.so" = "libmenuw.so"
"lib/libncurses.so" = "libncursesw.so"
"lib/libpanel.so" = "libpanelw.so"
"lib/libtermcap.so" = "libtinfow.so"
"lib/libtinfo.so" = "libtinfow.so"
"lib/pkgconfig/form.pc" = "formw.pc"
"lib/pkgconfig/menu.pc" = "menuw.pc"
"lib/pkgconfig/ncurses.pc" = "ncursesw.pc"
"lib/pkgconfig/panel.pc" = "panelw.pc"
"lib/pkgconfig/tinfo.pc" = "tinfow.pc"
