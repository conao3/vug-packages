version = "6.6"

[source]
url = "https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz"
sha256 = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"

[build]
kind = "autotools"
configure-flags = [
  "--with-shared",
  "--without-debug",
  "--without-ada",
  "--enable-widec",
  "--enable-pc-files",
  "--with-pkg-config-libdir={out}/lib/pkgconfig",
  "--with-termlib",
  "--disable-stripping",
]

[dependencies]
build = [
  "binutils",
  "make",
]
run = [
  "musl",
]

[check]
enabled = false
skip = []
